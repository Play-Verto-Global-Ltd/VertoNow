  templates:
    eyebrow: "Abelana Verto e"
    heading_html: 'Simolola ka <span style="color:#615BF5;">sekao</span>'
    subtitle: "Tlhopha Verto e e setseng e le teng mme o simolole go kgobokanya ka metsotso — sekao sengwe le sengwe se ka baakanngwa gotlhelele."
    back: "Boela kwa Boto ya Taolo"
    import_instead: "O setse o na le dipotso? Di tlise go na le moo →"
    use: "Dirisa sekao se"
    question_count: "Dipotso tse %{n}"
    start_button: "Simolola ka sekao"
    browse: "Sekaseka dikao"
    not_found: "Sekao seo ga se fitlhelesege."
    created: "O simolotse “%{name}” go tswa mo sekaong — se dire sa gago o bo o se phasaladitsa fa o siametse."
    # Per-template CONTENT, mirrored positionally from SurveyTemplates::ALL —
    # instantiating a template resolves these in the creator's locale, so the
    # new Verto starts in their language. Card entries align by index; an
    # `options` list must keep the registry card's length (positional answer
    # data). NPS number scales are not listed — numerals stay numerals.
    nps:
      name: "Sekgao sa go Eletsa (NPS)"
      tagline: "Lekanyetsa boikanyego ka dipotso di le pedi — bogolo jwa gore batho ba go eletsa ka teng, le ka ntlha yang."
      cards:
        - text: "Potso e khutshwane ka ga maitemogelo a gago"
          description: "Ka fa tlase ga motsotso, ga go na leina gotlhelele — dikarabo tsa gago di re thusa go tokafala."
        - text: "Go na le kgonagalo e kana kang ya gore o re eletse go tsala kgotsa modiri mmogo?"
        - text: "Ke lebaka lefe la konokono la sekoro sa gago?"
        - text: "Ke efe ya tse e go tlhalosang sentle?"
          options: ["Moreki o mosha", "Moreki yo o boang", "Moreki wa lobaka lo loleele", "Ke leba fela"]
    csat:
      name: "Kgotsofalo ya Bareki"
      tagline: "Tekanyetso e khutshwane ya CSAT: lekanyetsa maitemogelo, supa se se dirileng sentle, mme o utlwe se se tshwanetseng go baakanngwa."
      cards:
        - text: "Re dirile jang?"
          description: "Ditobetso di se kae tsa bonako — re a leboga go re thusa go tokafala."
        - text: "Ka kakaretso, o kgotsofetse go le kana kang ka maitemogelo a gago?"
          options: ["Ga ke a kgotsofala gotlhelele", "Ga ke a kgotsofala", "Fa gare", "Ke kgotsofetse", "Ke kgotsofetse thata"]
        - text: "Ke karolo efe ya maitemogelo a gago e e neng ya itshupa thata?"
          options: ["Bonolo jwa go dirisa", "Lebelo", "Thuso", "Boleng jwa madi", "Boleng"]
        - text: "A o ka re dirisa gape?"
        - text: "Ke eng se le sengwe se re ka se dirang sentle go go feta?"
    onboarding:
      name: "Go Amogela Badirisi ba Basha"
      tagline: "Fitlhela kwa badirisi ba basha ba kgomaregang teng le se se ka ba thusang go fitlhelela phenyo ya bone ya ntlha ka bonako."
      cards:
        - text: "Go simolola go ne go le jang?"
          description: "O sa tswa go baakanya dilo — re bolelele kafa go tsamaile ka teng e sa le foreshe mo tlhaloganyong."
        - text: "Go ne go le bonolo go le kana kang go simolola?"
          options: ["Go thata thata", "Go thata", "Go siame", "Bonolo", "Bonolo thata"]
        - text: "O ne wa kgomarela kae, fa o kile wa kgomarela?"
          options: ["Go ikwadisa", "Go baakanya dilo", "Go batla se ke neng ke se tlhoka", "Go tlhaloganya kafa e dirang ka teng", "Ga ke a kgomarela"]
        - text: "Ke eng se se neng se ka go thusa go simolola ka bonako? Tlhopha tsotlhe tse di go amang."
          options: ["Leeto le le eteletsweng", "Dikao kgotsa disekao", "Ditaelo tse di phepafetseng go feta", "Thuso ya puisano ya tlhamalalo", "Video e khutshwane"]
        - text: "Fa o ka fetola selo se le sengwe ka ga go simolola, e ka bo e le eng?"
    employee-pulse:
      name: "Tlhatlhobo ya Maikutlo a Badiri"
      tagline: "Kelo e e bonako, e e se nang leina, ya kafa setlhopha se ikutlwang ka teng tota beke eno — mmogo le eNPS."
      cards:
        - text: "Dilo di tsamaya jang, tota?"
          description: "Ga go na leina gotlhelele — se se tlhomameng ke go tokafatsa dilo, e seng go sekaseka mongwe."
        - text: "O ikutlwa jang ka tiro beke eno?"
          options: ["Ke a tlhoka", "Ga go a siama thata", "Go siame", "Go ntle", "Ke a atlega"]
        - text: "Morwalo wa tiro ya gago o jang jaanong?"
          options: ["O montsi thata", "O montsi go le gonnye", "O lekana", "O motlhofo go le gonnye", "O motlhofo thata"]
        - text: "O ikutlwa o tshegeditswe go le kana kang ke moetapele wa gago?"
          options: ["Ga go na le fa e le go le gonnye", "Go le gonnye", "Go tshwana le", "Sentle", "Sentle thata"]
        - text: "Go na le kgonagalo e kana kang ya gore o eletse fano jaaka lefelo la go bereka?"
        - text: "Ke phetogo efe e le nngwe e e ka dirang gore fano e nne lefelo le le botoka la go bereka?"
    event-feedback:
      name: "Maikutlo a Ketsaetso"
      tagline: "Tshwara kafa ketsaetso ya gago e amogetsweng ka teng — dintlha tse di gaisang, tse di sa siamang, le fa ba ka boa gape."
      cards:
        - text: "Re a leboga go tla — go ne go le jang?"
          description: "Dipotso di se kae tsa bonako fa e sa le foreshe mo tlhaloganyong."
        - text: "O ka lekanyetsa ketsaetso ka kakaretso jang?"
          options: ["E bokoa", "E lekanye", "E ntle", "E ntle thata", "E gaisitse"]
        - text: "Ke karolo efe e e neng e le botoka thata mo go wena?"
          options: ["Babui", "Dikagiso", "Go aga ditshwaragano", "Lefelo", "Thulaganyo"]
        - text: "A o ka tla gape?"
        - text: "Go na le kgonagalo e kana kang ya gore o eletse ketsaetso e go modiri mmogo?"
        - text: "Ke eng se se ka dirang gore e e latelang e nne botoka go feta?"
    product-market-fit:
      name: "Go Tshwanela ga Sedirisiwa mo Mmarakeng"
      tagline: "Teko e e itsegeng ya Sean Ellis — kafa batho ba ka ikutlwang ka teng kwantle ga wena, le gore ke mang yo o go tlotlang thata."
      cards:
        - text: "Re thuse go tlhopha kwa re yang teng"
          description: "Dikarabo di se kae tse di boammaaruri di dira pharologanyo e kgolo — re a leboga."
        - text: "O ne o tla ikutlwa jang fa o ka se tlhole o kgona go re dirisa?"
          options: ["Ke tla utlwa botlhoko thata", "Ke tla utlwa botlhoko go le gonnye", "Ke ka se utlwe botlhoko"]
        - text: "Ke molemo ofe wa konokono o o o bonang go tswa go rona?"
        - text: "O akanya gore ke mofuta ofe wa motho o o ka solegelwang molemo thata?"
          options: ["Batho ba ba tshwanang le nna", "Batho ba ba simololang", "Baitseanape", "Ditlhopha", "Ga ke tlhomamise"]
        - text: "Re ka e tokafatsa jang bakeng sa gago?"
  # The three set demographic questions appended to every Verto (see
  # DemographicQuestions) — resolved in the Verto's default locale at append
  # time, so a French Verto's tail asks in French. Positional; options keep
  # the registry lengths.
  demographics:
    cards:
      - text: "O na le dingwaga tse kae?"
        options: ["Ka fa tlase ga 16", "16–17", "18–24", "25–34", "35–49", "50–64", "65+"]
      - text: "O nna kae?"
        description: "E thusiwa ke OpenStreetMap — e thusa go aga mmapa o o ka o sekasekang morago ga go fetsa."
      - text: "Ke bong bofe jo bo go tlhalosang sentle thata?"
        options: ["Monna", "Mosadi", "Ga se monna kgotsa mosadi", "E Sele", "Ke rata go se bue"]
    # Opt-in demographic questions (DemographicQuestions::OPTIONAL_CARDS) —
    # map-shaped by demographic_key, NOT positional like cards above. Options
    # are only taken whole and at registry length; the last two neurodiversity
    # options are the mutually-exclusive pair in every language.
    optional:
      heritage:
        text: "Ke efe ya tse e bontshang setso sa gago sentle?"
        description: "Setso sa gago sa morafe kgotsa ngwao."
        options: ["Setso sa Asia", "Setso sa Baaphiri, Afrika kgotsa Karibiane", "Sepanishe kgotsa Latino/a", "Setso sa Bogareng jwa Botlhaba kgotsa Bokone jwa Afrika", "Setso sa Makgowa kgotsa Yuropa", "Setso sa Baagi ba Tlhago", "Setso se se tswakantsweng kgotsa se le mmalwa", "Setso se sengwe", "Ke rata go se bue"]
      neurodiversity:
        text: "A go na le tse di go tlhalosang mo go tse?"
        description: "Ka ga kafa o akanyang le go sekaseka tshedimosetso ka teng — tlhopha tsotlhe tse di go amang."
        options: ["ADHD", "Autism", "Dyslexia", "Dyspraxia", "Dyscalculia", "Tourette's", "Mofuta o mongwe wa pharologano ya boko", "Ga go na epe ya tse", "Ke rata go se bue"]
