  welcome_mailer:
    subject: "Amogelesega mo Playverto — a re ageng Verto ya gago ya ntlha"
    heading: "Sengwe le sengwe se siame"
    intro: "Imeile ya gago e netefaditswe. Verto ke dipatlisiso tse batho ba tota ba di ratang go di araba — dikarata tse ba di tobetsang go na le foromo e ba e itshokelang. Tsela e e bonako ya go bona e nngwe ke go simolola ka sekao mme o fetole dipotso."
    cta: "Simolola ka sekao"
    step_one: "Tlhopha sekao, kgotsa o tlhalose se o batlang go se ithuta mme o letle Playverto e kwale dipotso."
    step_two: "Baakanya karata epe fela. Dintlha tsa Verto ka fa go la ntona di go bontsha se se dirang le se se sa direng."
    step_three: "Phasaladitsa, o bo o abelana kgokaganyo kgotsa khoutu ya yona ya QR. Diphetho di goroga fa batho ba araba."
    footer: "O tsentse kwa go sele? Boto ya gago ya taolo e dula e le fano:"
    sent_by: "E rometswe ke Playverto"
  wizard:
    demographics_note: "Verto nngwe le nngwe e fela ka dipotso tse 3 tse di tlhomilweng tsa boleng jwa setho — fa o tsholetsweng, kwa o nnang teng, le bong. Verto e di oketsa ka bo yona: di boloka kgobokanyo ya data e tsamaya sentle mme di godisa setlhopha sa dipatlisiso mo lefelong lotlhe."
