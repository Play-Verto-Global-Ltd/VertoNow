    welcome_badge: "Verto e Ntšha"
    welcome_title: "A re ageng Verto ya gago."
    welcome_sub: "Re tla fetola tshedimosetso ya gago go nna Verto e e latelang melao ya Playverto."
    welcome_ready_html: "Tobetsa <strong style=\"color:rgba(0,0,0,0.6);\">Latelang</strong> fa o siametse."
    examples: "Dikao"
    s1_eyebrow: "Kgato 01 · Ka ga Verto ya gago"
    s1_lead: "Setlhogo se le sengwe se segolo."
    s1_body: "Se dire bophara — o tla tshwaraganya mowa mo dikgatong tse di latelang. Lefoko le le lengwe kgotsa a mabedi gantsi a lekana."
    s1_examples:
      - "Tiro ka ga tlelaemete"
      - "Thuto ya baabaneng"
      - "Tshireletsego ya dijo"
    s1_title: "Verto ya gago e ka ga eng?"
    s1_placeholder: "sk. Boitekanelo jwa Basha"
    s1_hint_body: "Se dire bophara — o tla tshwaraganya mowa mo dikgatong tse di latelang."
    s2_eyebrow: "Kgato 02 · Ke mang yo o arabang"
    s2_lead: "Dingwaga pele — go bo go latela lefelo le maemo."
    s2_body: "Simolola ka tlhopho ya dingwaga tsa bone, o bo o oketsa kwa ba leng teng le se ba se dirang. '25–40 baoki kwa Manchester' e gaisa 'batho ba bagolo' — dingwaga, lefelo, tiro, puo le mokgwa wa botshelo tsotlhe di dira dipotso tse re di kwalang di nna botlhoko go gaisa."
    s2_examples:
      - "Baithuti ba dikolo tse di kwa godimo ba dingwaga 18–24 kwa Kenya"
      - "Badiredi ba pele ba boitekanelo jwa setshaba ba dingwaga 35–55"
      - "Batsadi ba bana ba dingwaga tsa sekolo kwa magaeng a NSW"
    s2_title: "Ke mang yo o arabang — mme ba na le dingwaga di le kae?"
    s2_placeholder: "sk. Baithuti ba dikolo tse di kwa godimo ba dingwaga 18–24 kwa Kenya"
    s2_hint_body: "Mokgwa wa botshelo, tiro, kgaolo, puo — sengwe le sengwe se se bopang kafa setlhopha se se akanyang ka teng."
    s3_eyebrow: "Kgato 03 · Boikaelelo jwa go ithuta"
    s3_lead: "Kitso e e ka fetolang tshwetso."
    s3_body: "Tlolela dilo tse o setseng o di itse. Lebisa go sengwe se le sengwe se, fa o ka se ithuta, se ka fetolang se o se dirang morago ga foo."
    s3_examples:
      - "Ke ka ntlha yang fa baithaopi ba tlogela morago ga kgwedi ya boraro?"
      - "Ke eng se se thibelang batho go fitlhelela banka ya rona ya dijo?"
      - "A lenaneo la rona la basha le tota le fetola boikanyego — mme go le kae?"
    s3_title: "O batla go ithuta eng mo go bone?"
    s3_placeholder: "sk. Ke ka ntlha yang fa baithaopi ba tlogela morago ga kgwedi ya boraro?"
    s3_hint_body: "Tlolela se o setseng o se itse — lebisa go sengwe se le sengwe se se ka fetolang se o se dirang morago ga foo."
    s4_eyebrow: "Kgato 04 · Dipuo"
    s4_lead: "Fitlhelela mongwe le mongwe ka puo ya gagwe."
    s4_body: "Re tla kwala Verto ka puo ya gago ya konokono, go bo go dirwa toloko e e lekanang mo puong nngwe le nngwe. Toloko nngwe le nngwe e botsa dipotso tse di tshwanang, gore diphetho di sale di kgona go bapisiwa."
    s4_title: "Verto e e tshwanetse go bua dipuo dife?"
    s4_primary_label: "Puo ya konokono"
    s5_eyebrow: "Kgato 06 · Ditokafatso tsa bofelo"
    s5_lead: "Dintlha di se kae tsa bofelo."
    s5_body: "Tlhopha kafa o ratang go simolola ka teng le mebala ya letshwao. Pontsho e e bontsha kafa Verto ya gago e tla ikutlwang ka teng."
    s5_live_preview: "Pontsho e e tshedileng"
    s5_quick_poll: "Potsotshwaana e e bonako"
    s5_mock_q: "O e fitlhela jang?"
    s5_mock_opt: "Ke a e rata"
    s5_title: "Ditokafatso tsa bofelo"
    s5_sub: "Tlhopha kafa o ka simololang ka teng, o bo o e dira ya gago."
    section_how_to_start: "Kafa o ka simololang ka teng"
    section_brand_colours: "Mebala ya letshwao"
    brand_primary: "Ya Konokono"
    brand_primary_desc: "Ditlhogo le dikgabo"
    brand_cta: "Dikonopo (CTA)"
    brand_cta_desc: "Dikonopo tsa Latelang / Romela"
    brand_bg: "Kwa Morago"
    brand_bg_desc: "Setlolo kwa morago ga dikarata"
    brand_panel: "Panele ya molema"
    brand_panel_desc: "Panele ya mmoni ya karata nngwe le nngwe"
    s6_eyebrow: "Kgato 05 · Maemo"
    optional: "Ga se Tlhokego"
    s6_lead: "A go na le sengwe se sengwe se re tshwanetseng go se tsenya?"
    s6_body: "Mowa, dilo tse di tshwanetseng go botswa, tse di tshwanetseng go tilwa, dinonofo tsa batheeledi. Tlolela fa go se na sepe se sengwe."
    s6_examples:
      - "E tshwanetse go akaretsa potso ka ga ditsela tsa madi le dikgoreletsi tsa dithuso."
      - "Tila mafoko a a thata — baarabi ba bantsi ba bua Sekgowa jaaka puo ya bobedi."
      - "Boloka mowa o o bothito, e seng wa khampani."
    s6_title: "A go na le sengwe se sengwe se re tshwanetseng go se itse?"
    s6_placeholder: "sk. Batheeledi ga ba ise ba dirise Playverto pele, boloka mowa o o bothito, e seng wa khampani."
    s6_compare_label: "Letla baarabi go bapisa dikarabo tsa bone"
    s6_compare_desc: "Bontsha CTA mo tsebeng ya tebogo e e bontshang kafa dikarabo tsa bone di lekanang le tsa botlhe."
    quiz_label: "Dira se e nne tlhatlhobo"
    quiz_desc: "Tshwaya dikarabo di nepagetse kgotsa ga di a nepagala, bontsha batshameka dintlha tsa bone, mme o ba letle go bapisa le ba bangwe. O tlhoma dikarabo tse di nepagetseng morago ga go dira."
    s7_eyebrow: "Kgato 07 · Ntlhamo ya bofelo"
    s7_lead: "Bula ka Verto e e feletseng, kgotsa setlolo se se se nang sepe."
    s7_body: "Re tlhopha kwa morago le ditshwantsho tsa karata nngwe le nngwe go tswa mo laeboraring ya rona e e rulagantsweng — tse di tsamaisanyang le setlhogo sa gago, batheeledi le potso mo karateng nngwe le nngwe."
    s7_perks_label: "Se go tlatsang dikagiso go go nayang sona"
    s7_perks:
      - "Kwa morago ga Verto go tsamaisanya le setlhogo"
      - "Ditshwantsho mo karateng nngwe le nngwe, go akaretswa dikarata tsa go sutha"
      - "Tswakanya ditshwantsho mo sefetoding go fitlha go siame"
    s7_title: "O ka rata go simolola jang?"
    s7_sub: "O sa ntse o ka fetola sengwe le sengwe mo sefetoding."
    s7_recommended: "E Eletswang"
    s7_populate_label: "Tlatsa dikagiso"
    s7_populate_desc: "Bula sefetodi ka kwa morago le setshwantsho mo karateng nngwe le nngwe, tse di tsamaisanyang le tshedimosetso ya gago."
