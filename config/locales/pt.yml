          options: ["Facilidade de uso", "Rapidez", "Suporte", "Boa relação qualidade-preço", "Qualidade"]
        - text: "Voltaria a usar-nos?"
        - text: "O que poderíamos fazer melhor?"
    onboarding:
      name: "Integração de Novos Utilizadores"
      tagline: "Descubra onde os novos utilizadores ficam presos e o que os ajudaria a chegar mais depressa à primeira vitória."
      cards:
        - text: "Como foi começar?"
          description: "Acabou de configurar tudo — conte-nos como correu enquanto está fresco."
        - text: "Quão fácil foi começar?"
          options: ["Muito difícil", "Difícil", "Razoável", "Fácil", "Muito fácil"]
        - text: "Onde é que ficou preso, se é que ficou?"
          options: ["No registo", "Na configuração", "A encontrar o que precisava", "A perceber como funciona", "Não fiquei preso"]
        - text: "O que o teria ajudado a começar mais depressa? Escolha todas as que se aplicam."
          options: ["Uma visita guiada", "Modelos ou exemplos", "Instruções mais claras", "Suporte por chat ao vivo", "Um vídeo curto"]
        - text: "Se pudesse mudar uma coisa no início, o que seria?"
    employee-pulse:
      name: "Pulso da Equipa"
      tagline: "Uma leitura rápida e anónima de como a equipa se sente realmente esta semana — mais um eNPS."
      cards:
        - text: "Como vão as coisas, a sério?"
          description: "Totalmente anónimo — isto é para melhorar as coisas, não para controlar ninguém."
        - text: "Como se sente em relação ao trabalho esta semana?"
          options: ["Em dificuldades", "Não muito bem", "Razoável", "Bem", "Muito bem"]
        - text: "Como está a sua carga de trabalho neste momento?"
          options: ["Demasiado alta", "Um pouco alta", "No ponto certo", "Um pouco leve", "Leve demais"]
        - text: "Quão apoiado se sente pelo seu gestor?"
          options: ["Nada", "Um pouco", "Mais ou menos", "Bem", "Muito bem"]
        - text: "Qual é a probabilidade de recomendar este como um bom lugar para trabalhar?"
        - text: "Que mudança tornaria este um lugar melhor para trabalhar?"
    event-feedback:
      name: "Feedback de Evento"
      tagline: "Capte como o seu evento correu — os pontos altos, as falhas e se voltariam."
      cards:
        - text: "Obrigado por ter vindo — como foi?"
          description: "Umas perguntas rápidas enquanto ainda está fresco."
        - text: "Como avalia o evento no geral?"
          options: ["Fraco", "Razoável", "Bom", "Muito bom", "Excelente"]
        - text: "Qual foi a melhor parte para si?"
          options: ["Os oradores", "O conteúdo", "O networking", "O local", "A organização"]
        - text: "Voltaria a participar?"
        - text: "Qual é a probabilidade de recomendar este evento a um colega?"
        - text: "O que tornaria o próximo ainda melhor?"
    product-market-fit:
      name: "Product-Market Fit"
      tagline: "O clássico teste de Sean Ellis — como as pessoas se sentiriam sem si, e quem mais o valoriza."
      cards:
        - text: "Ajude a definir o nosso próximo passo"
          description: "Algumas respostas sinceras fazem toda a diferença — obrigado."
        - text: "Como se sentiria se já não pudesse usar-nos?"
          options: ["Muito desiludido", "Algo desiludido", "Nada desiludido"]
        - text: "Qual é o principal benefício que obtém de nós?"
        - text: "Que tipo de pessoa acha que mais beneficiaria?"
          options: ["Pessoas como eu", "Principiantes", "Profissionais", "Equipas", "Não sei"]
        - text: "Como podemos melhorar para si?"
