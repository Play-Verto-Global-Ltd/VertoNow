  templates:
    eyebrow: "이 Verto 공유하기"
    heading_html: <span style="color:#615BF5;">템플릿</span>으로 시작하기
    subtitle: 바로 쓸 수 있는 Verto를 골라 몇 분 만에 응답을 모아 보세요. 모든 템플릿은 자유롭게 편집할 수 있습니다.
    back: 대시보드로 돌아가기
    import_instead: "이미 질문이 있나요? 대신 가져오기 →"
    use: 이 템플릿 사용
    question_count: 질문 %{n}개
    start_button: 템플릿으로 시작
    browse: 템플릿 둘러보기
    not_found: 해당 템플릿을 사용할 수 없습니다.
    created: 템플릿에서 “%{name}”을(를) 만들었습니다. 원하는 대로 수정하고 준비되면 게시하세요.
    nps:
      name: "순추천지수 (NPS)"
      tagline: "두 가지 질문으로 충성도를 측정하세요 — 우리를 추천할 가능성이 얼마나 되는지, 그리고 그 이유는 무엇인지."
      cards:
        - text: "경험에 대해 간단히 여쭤볼게요"
          description: "1분이면 충분하고 완전히 익명입니다 — 답변은 개선에 큰 도움이 됩니다."
        - text: "친구나 동료에게 저희를 추천할 가능성은 얼마나 되나요?"
        - text: "그 점수를 주신 가장 큰 이유는 무엇인가요?"
        - text: "다음 중 본인을 가장 잘 설명하는 것은 무엇인가요?"
          options: ["신규 고객", "재방문 고객", "오랜 단골 고객", "그냥 둘러보는 중"]
    csat:
      name: "고객 만족도 (CSAT)"
      tagline: "짧은 CSAT 펄스: 경험을 평가하고, 좋았던 점을 짚고, 개선할 점을 들어 보세요."
      cards:
        - text: "저희, 어땠나요?"
          description: "몇 번만 탭하면 끝나요 — 더 나아지도록 도와주셔서 감사합니다."
        - text: "전반적으로 이번 경험에 얼마나 만족하시나요?"
          options: ["매우 불만족", "불만족", "보통", "만족", "매우 만족"]
        - text: "이번 경험에서 가장 인상 깊었던 부분은 무엇인가요?"
          options: ["사용 편의성", "속도", "고객 지원", "가격 대비 가치", "품질"]
        - text: "다시 이용하시겠어요?"
        - text: "저희가 더 잘할 수 있는 한 가지는 무엇일까요?"
    onboarding:
      name: "신규 사용자 온보딩"
      tagline: "신규 사용자가 어디에서 막히는지, 첫 성공까지 더 빨리 도달하려면 무엇이 필요한지 알아보세요."
      cards:
        - text: "시작해 보니 어땠나요?"
          description: "방금 설정을 마치셨죠 — 기억이 생생할 때 이야기해 주세요."
        - text: "시작하기가 얼마나 쉬웠나요?"
          options: ["매우 어려웠어요", "어려웠어요", "그럭저럭 괜찮았어요", "쉬웠어요", "매우 쉬웠어요"]
        - text: "혹시 막힌 곳이 있었다면 어디였나요?"
          options: ["가입하기", "설정하기", "필요한 것 찾기", "작동 방식 이해하기", "막힌 곳이 없었어요"]
        - text: "무엇이 있었다면 더 빨리 시작할 수 있었을까요? 해당하는 것을 모두 골라 주세요."
          options: ["가이드 투어", "템플릿이나 예시", "더 명확한 안내", "실시간 채팅 지원", "짧은 동영상"]
        - text: "시작 과정에서 한 가지를 바꿀 수 있다면 무엇을 바꾸시겠어요?"
    employee-pulse:
      name: "직원 펄스 체크"
      tagline: "이번 주 팀의 진짜 분위기를 빠르고 익명으로 확인하세요 — eNPS도 함께."
      cards:
        - text: "요즘 정말 어떠세요?"
          description: "완전히 익명입니다 — 감시가 아니라 더 나은 환경을 만들기 위한 것이에요."
        - text: "이번 주 일에 대한 기분은 어떤가요?"
          options: ["힘들어요", "별로예요", "그럭저럭이에요", "좋아요", "아주 좋아요"]
        - text: "지금 업무량은 어떤가요?"
          options: ["너무 많아요", "조금 많아요", "적당해요", "조금 적어요", "너무 적어요"]
        - text: "매니저에게 얼마나 지원받고 있다고 느끼나요?"
          options: ["전혀 아니에요", "조금요", "어느 정도요", "잘 받고 있어요", "아주 잘 받고 있어요"]
        - text: "이곳을 일하기 좋은 곳으로 추천할 가능성은 얼마나 되나요?"
        - text: "이곳을 더 좋은 일터로 만들 한 가지 변화가 있다면 무엇일까요?"
    event-feedback:
      name: "행사 피드백"
      tagline: "행사가 어땠는지 담아 보세요 — 좋았던 점, 아쉬웠던 점, 그리고 다시 올 마음이 있는지."
      cards:
        - text: "와 주셔서 감사해요 — 어떠셨나요?"
          description: "기억이 생생할 때 간단한 몇 가지만 여쭤볼게요."
        - text: "행사를 전반적으로 어떻게 평가하시나요?"
          options: ["아쉬웠어요", "그저 그랬어요", "좋았어요", "훌륭했어요", "최고였어요"]
        - text: "가장 좋았던 부분은 무엇이었나요?"
          options: ["연사", "콘텐츠", "네트워킹", "장소", "운영"]
        - text: "다음에도 참석하시겠어요?"
        - text: "동료에게 이 행사를 추천할 가능성은 얼마나 되나요?"
        - text: "다음 행사가 더 좋아지려면 무엇이 필요할까요?"
    product-market-fit:
      name: "제품-시장 적합성"
      tagline: "고전적인 션 엘리스 테스트 — 우리가 없다면 어떤 기분일지, 누가 우리를 가장 가치 있게 여기는지."
      cards:
        - text: "다음 방향을 함께 정해 주세요"
          description: "솔직한 답변 몇 개가 정말 큰 차이를 만듭니다 — 감사합니다."
        - text: "더 이상 저희를 이용할 수 없다면 어떤 기분일 것 같나요?"
          options: ["매우 아쉬울 거예요", "조금 아쉬울 거예요", "아쉽지 않을 거예요"]
        - text: "저희에게서 얻는 가장 큰 이점은 무엇인가요?"
        - text: "어떤 사람이 가장 큰 도움을 받을 것 같나요?"
          options: ["저 같은 사람", "초보자", "전문가", "팀", "잘 모르겠어요"]
        - text: "어떻게 하면 더 좋아질 수 있을까요?"
  demographics:
