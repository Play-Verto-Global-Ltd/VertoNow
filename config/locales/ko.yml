    s2_body: "연령대로 시작한 뒤 어디에 있고 무엇을 하는지 더하세요. '맨체스터의 25–40세 간호사'가 '성인'보다 낫습니다 — 나이, 장소, 역할, 언어, 라이프스타일이 질문을 더 날카롭게 만들어요."
    s2_examples:
