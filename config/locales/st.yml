    optional: "Ha ho Hlokahale"
    s6_lead: "Ho na le se seng seo re lokelang ho se kenya?"
    s6_body: "Molumo, seo se tlamehang ho botswa, dintho tse tlolwang, ditshwaeso tsa bamameli. Tlola haeba ho se na ntho e eketsehileng."
    s6_examples:
      - "E tlameha ho kenya potso ka ditsela tsa thuso ya ditjhelete le dithibelo tsa ho fumana thuso."
      - "Qoba mantswe a thata — baarabi ba bangata ba bua Senyesemane e le puo ya bobedi."
      - "Boloka molumo o le mofuthu, e seng wa khampani."
    s6_title: "Ho na le se seng seo re lokelang ho se tseba?"
    s6_placeholder: "mohlala: Bamameli ha ba so ka ba sebedisa Playverto, boloka molumo o le mofuthu, e seng wa khampani."
