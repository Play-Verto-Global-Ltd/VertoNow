  welcome_mailer:
    subject: "Rea o Amohela ho Playverto — ha re aheng Verto ya hao ya pele"
    heading: "O se o lokile ka botlalo"
    intro: "Imeile ya hao e netefaditswe. Verto ke patlisiso eo batho ba e thabelang ho e araba — dikarete tseo ba di tobetsang ho e-na le fomo eo ba e mamellang. Tsela e potlakileng ka ho fetisisa ya ho bona e nngwe ke ho qala ka mohlala mme o fetole dipotso."
    cta: "Qala ka mohlala"
    step_one: "Kgetha mohlala, kapa o hlalose seo o batlang ho ithuta sona mme o lumelle Playverto ho ngola dipotso."
    step_two: "Fetola karete efe kapa efe. Lintlha tsa Verto lehlakoreng le letona di o bontsha se sebetsang le se sa sebetseng."
    step_three: "Phatlalatsa, ebe o arolelane kgokahano kapa khoutu ya yona ya QR. Diphetho di kena ha batho ba araba."
    footer: "O kene kae kae hape? Boto ya hao ya taolo e dula e le mona:"
    sent_by: "E rometswe ke Playverto"
  wizard:
    demographics_note: "Verto e nngwe le e nngwe e fela ka dipotso tse 3 tse tsitsitseng tsa boemo — ha o hlahile, moo o dulang teng, le bong. Verto e di kenya ka boyona: di boloka pokello ya datha e tshwana mme di hodisa sehlopha sa dipatlisiso jwaloka lebatowa."
