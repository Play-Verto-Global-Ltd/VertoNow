    s6_compare_desc: "Bontsha CTA leqepheng la kea leboha e bontshang kamoo dikarabo tsa bona di tshwanang le tsa bohle."
    quiz_label: "Etsa sena e be teko ya tsebo"
    quiz_desc: "Tshwaya dikarabo e le tse nepahetseng kapa tse fosahetseng, bontsha babapadi lintlha tsa bona, mme o ba dumellle ho bapisa le ba bang. O beha dikarabo tse nepahetseng ka mor'a ho hlahisa."
    s7_eyebrow: "Mohato 07 · Mosisinyo wa ho qetela"
    s7_lead: "Bula ka Verto e qetetsweng, kapa sebaka se se nang letho."
    s7_body: "Re kgetha bokamorao le ditshwantsho tsa karete ka nngwe ho tswa polokelong ya rona e hlophisitsweng — di lumellana le sehlooho sa hao, bamameli le potso karetteng ka nngwe."
    s7_perks_label: "Seo ho tlatsa maikutlo ho o fang sona"
    s7_perks:
