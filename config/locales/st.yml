    welcome_badge: "Verto e Ntjha"
    welcome_title: "Ha re ahe Verto ya hao."
    welcome_sub: "Re tla fetola tlhahiso ya hao ho ba Verto e latelang melawana ya Playverto."
    welcome_ready_html: "Tobetsa <strong style=\"color:rgba(0,0,0,0.6);\">E Latelang</strong> ha o se o itokisitse."
    examples: "Mehlala"
    s1_eyebrow: "Mohato 01 · Ka Verto ya hao"
    s1_lead: "Sehlooho se le seng se akaretsang tsohle."
    s1_body: "Se boloke se pharaletse — o tla se hlophisa haholwanyane mehatong e latelang. Lentswe le le leng kapa a mabedi hangata a lekana."
    s1_examples:
      - "Bohato ba tikoloho"
      - "Thuto ya baphaphathehi"
      - "Tshireletso ya dijo"
    s1_title: "Verto ya hao e mabapi le eng?"
    s1_placeholder: "mohlala: Boiketlo ba bacha"
    s1_hint_body: "Se boloke se pharaletse — o tla se hlophisa haholwanyane mehatong e latelang."
    s2_eyebrow: "Mohato 02 · Ke mang ya arabang"
    s2_lead: "Dilemo pele — ebe sebaka le boemo."
    s2_body: "Qala ka lebanta la dilemo tsa bona, ebe o eketse moo ba leng teng le seo ba se etsang. '25–40 diramoli tsa Manchester' e feta 'batho ba baholo' — dilemo, sebaka, mosebetsi, puo le mokgwa wa bophelo tsohle di hlomamisa dipotso tseo re di ngolang."
    s2_examples:
      - "Baithuti ba diyunivesithi ba dilemo tse 18–24 Kenya"
      - "Basebetsi ba tlhokomelo ya bophelo bo botle sehlopheng ba dilemo tse 35–55"
      - "Batswadi ba bana ba dilemo tsa sekolo mahaeng NSW"
    s2_title: "Ke mang ya arabang — mme ba na le dilemo tse kae?"
    s2_placeholder: "mohlala: Baithuti ba diyunivesithi ba dilemo tse 18–24 Kenya"
    s2_hint_body: "Mokgwa wa bophelo, mosebetsi, sebaka, puo — eng kapa eng e hlomang kamoo sehlopha sena se nahanang kateng."
    s3_eyebrow: "Mohato 03 · Sepheo sa ho ithuta"
    s3_lead: "Tsebo e neng e ka fetola qeto."
    s3_body: "Tlola dintho tseo o se o di tseba. Sheba ntho e le nngwe eo, ha o ka e ithuta, e neng e ka fetola seo o se etsang hamorao."
    s3_examples:
      - "Ke hobaneng baithaopi ba tlohela ka mor'a kgwedi ya boraro?"
      - "Ke eng se thibelang batho ho fihlella banka ya rona ya dijo?"
      - "Na lenaneo la rona la bacha le hlile le fetola tshepo — mme hokae hantle?"
    s3_title: "O batla ho ithuta eng ho bona?"
    s3_placeholder: "mohlala: Ke hobaneng baithaopi ba tlohela ka mor'a kgwedi ya boraro?"
    s3_hint_body: "Tlola seo o se tsebang — sheba ntho e le nngwe e neng e ka fetola seo o se etsang hamorao."
    s4_eyebrow: "Mohato 04 · Dipuo"
    s4_lead: "Fihlella bohle ka puo ya bona."
    s4_body: "Re tla ngola Verto ka puo ya hao ya motheo, ebe re theha phetolelo e lekanang ntle e le tsotsi ka puo e nngwe le e nngwe. Phetolelo e nngwe le e nngwe e botsa dipotso tse tshwanang, ka hona diphetho di dula di lumellana."
    s4_title: "Verto ena e lokela ho bua dipuo dife?"
    s4_primary_label: "Puo ya motheo"
    s5_eyebrow: "Mohato 06 · Metsotso ya ho qetela"
    s5_lead: "Metsotso e seng mekae ya ho qetela."
    s5_body: "Kgetha kamoo o batlang ho qala kateng le mmala wa letshwao. Pontsho e bontsha kamoo Verto ya hao e tla utlwahala kateng."
