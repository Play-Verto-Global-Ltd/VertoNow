    question_count: "Dipotso tse %{n}"
    start_button: "Qala ka mohlala"
    browse: "Sheba mehlala"
    not_found: "Mohlala oo ha o fumanehe."
    created: "O qadile “%{name}” ho tswa mohlaleng — o o etse wa hao mme o o phatlalatse ha o se o itokisitse."
    # Per-template CONTENT, mirrored positionally from SurveyTemplates::ALL —
    # instantiating a template resolves these in the creator's locale, so the
    # new Verto starts in their language. Card entries align by index; an
    # `options` list must keep the registry card's length (positional answer
    # data). NPS number scales are not listed — numerals stay numerals.
    nps:
      name: "Boemo ba Boitshepiso"
      tagline: "Lekanya botshepehi ka dipotso tse pedi — hore na batho ba ka o kgothaletsa hakae, le hobaneng."
      cards:
        - text: "Potso e potlakileng ka boiphihlelo ba hao"
          description: "Ka tlase ho motsotso, e se nang lebitso ka botlalo — dikarabo tsa hao di re thusa ho ntlafatsa."
        - text: "O ka rata ho re kgothaletsa ho motswalle kapa mosebetsi-mmoho hakae?"
        - text: "Ke lebaka lefe le ka sehloohong la lintlha tsa hao?"
        - text: "Ke efe ho tsena e o hlalosang hantle?"
          options: ["Moreki e mocha", "Moreki ya kgutlang", "Moreki wa nako e telele", "Ke sheba feela"]
    csat:
      name: "Kgotsofalo ya Bareki"
      tagline: "Tlhahlobo e kgutshwane ya CSAT: lekanya boiphihlelo, fumana se sebeditseng, mme o utlwe se lokelang ho lokiswa."
      cards:
        - text: "Re entse jwang?"
          description: "Ditobetso tse seng kae feela — kea leboha ka ho re thusa ho ntlafala."
        - text: "Ka kakaretso, o kgotsofetse hakae ka boiphihlelo ba hao?"
          options: ["Ha ke a kgotsofala le hohle", "Ha ke a kgotsofala", "Ha ke tsee lehlakore", "Kea kgotsofala", "Kea kgotsofala haholo"]
        - text: "Ke karolo efe ya boiphihlelo ba hao e ileng ya hlaha ka ho fetisisa?"
          options: ["Bonolo ba ho sebedisa", "Lebelo", "Tshehetso", "Boleng ba tjhelete", "Boleng"]
        - text: "Na o ka re sebedisa hape?"
        - text: "Ke ntho e le nngwe efe eo re ka e etsang hantle ho feta?"
    onboarding:
      name: "Ho Amohela Basebedisi ba Batjha"
      tagline: "Fumana moo basebedisi ba batjha ba kgomarelang teng le seo se ka ba thusang ho fihlela katleho ya bona ya pele kapele."
      cards:
        - text: "Ho qala ho bile jwang?"
          description: "O sa tswa ho lokisa dintho — re bolelle kamoo ho tsamaileng ha e sa ntse e le ntjha kelellong ya hao."
        - text: "Ho ne ho le bonolo hakae ho qala?"
          options: ["Ho thata haholo", "Ho thata", "Ho lokile", "Ho bonolo", "Ho bonolo haholo"]
        - text: "Na ho na le moo o ileng wa kgomarela teng?"
          options: ["Ho ingodisa", "Ho lokisa dintho", "Ho fumana seo ke se hlokang", "Ho utlwisisa kamoo e sebetsang kateng", "Ha ke a kgomarela"]
        - text: "Ke eng se neng se ka o thusa ho qala kapele? Kgetha tsohle tse sebetsang."
          options: ["Leeto le tsamaiswang", "Mehlala kapa dintho tse bontshang", "Ditaelo tse hlakileng", "Tshehetso ya puisano ya ka ho toba", "Video e kgutshwane"]
        - text: "Ha o ka fetola ntho e le nngwe ka ho qala, e ka ba eng?"
    employee-pulse:
      name: "Tlhahlobo ya Maikutlo a Basebetsi"
      tagline: "Tlhahlobo e potlakileng, e se nang lebitso, ya kamoo sehlopha se ikutlwang hantle kateng bekeng ena — hammoho le eNPS."
      cards:
        - text: "Dintho di tsamaya jwang, hantle?"
          description: "E se nang lebitso ka botlalo — sepheo ke ho ntlafatsa dintho, e seng ho hlahloba motho."
        - text: "O ikutlwa jwang ka mosebetsi bekeng ena?"
          options: ["Ke thatafalletswe", "Ha ho hantle haholo", "Ho lokile", "Ho lokile haholo", "Ke atlehile haholo"]
        - text: "Mosebetsi wa hao o kae hona jwale?"
          options: ["O montsi haholo", "O montsi hanyenyane", "O lekana", "O bobebe hanyenyane", "O bobebe haholo"]
        - text: "O ikutlwa o tshehetswa hakae ke motsamaisi wa hao?"
          options: ["Ha ho le hanyenyane", "Hanyenyane", "Ka tekano e itseng", "Hantle", "Hantle haholo"]
        - text: "O ka rata ho kgothaletsa mona e le sebaka sa ho sebetsa hakae?"
        - text: "Ke phetoho efe e le nngwe e ka etsang mona e be sebaka se betere sa ho sebetsa?"
    event-feedback:
      name: "Maikutlo a Mokete"
      tagline: "Hapa kamoo mokete wa hao o ileng wa amoha kateng — se ileng sa hlaha, se fositseng, le hore na ba ka kgutla hape."
      cards:
        - text: "Kea leboha ka ho tla — ho bile jwang?"
          description: "Dipotso tse seng kae tse potlakileng ha e sa ntse e le ntjha kelellong."
        - text: "O ka lekanya mokete ka kakaretso jwang?"
          options: ["O fokolang", "O lekaneng", "O motle", "O motle haholo", "O motle ka ho fetisisa"]
        - text: "Ke karolo efe e ileng ya ba ntle ka ho fetisisa bakeng sa hao?"
          options: ["Babui", "Diteng", "Ho theha marang-rang", "Sebaka", "Tsamaiso"]
        - text: "Na o ka tla hape?"
        - text: "O ka rata ho kgothaletsa mokete ona ho mosebetsi-mmoho hakae?"
        - text: "Ke eng se ka etsang o latelang o be betere?"
    product-market-fit:
      name: "Product-Market Fit"
      tagline: "Teko e tsebahalang ya Sean Ellis — kamoo batho ba neng ba tla ikutlwa kateng ntle le wena, le hore na ke mang ya o thabelang ka ho fetisisa."
      cards:
        - text: "Re thuse ho etsa qeto ya hore na re ya kae kamora mona"
          description: "Dikarabo tse seng kae tsa nnete di etsa phapang e kgolo — kea leboha."
        - text: "O ne o tla ikutlwa jwang ha o ne o sa tlo hlola o kgona ho re sebedisa?"
          options: ["Ke ne ke tla utlwa bohloko haholo", "Ke ne ke tla utlwa bohloko hanyenyane", "Ke ne ke ke ke ka utlwa bohloko"]
        - text: "Ke molemo ofe o ka sehloohong oo o o fumanang ho tswa ho rona?"
        - text: "O nahana hore ke mofuta ofe wa motho o neng o tla ruarua ka ho fetisisa?"
          options: ["Batho ba kang nna", "Ba qalang", "Ditsebi", "Dihlopha", "Ha ke na bonnete"]
        - text: "Re ka e ntlafatsa jwang bakeng sa hao?"
  # The three set demographic questions appended to every Verto (see
  # DemographicQuestions) — resolved in the Verto's default locale at append
  # time, so a French Verto's tail asks in French. Positional; options keep
  # the registry lengths.
  demographics:
    cards:
      - text: "U lilemo li kae?"
        options: ["Ka tlase ho 16", "16–17", "18–24", "25–34", "35–49", "50–64", "65+"]
      - text: "O dula kae?"
        description: "E tsamaiswa ke OpenStreetMap — e thusa ho aha mmapa oo o ka o sekasekang ha o qeta."
      - text: "Ke bong bofe bo o hlalosang ka ho fetisisa?"
        options: ["Monna", "Mosadi", "Ha se monna kapa mosadi", "E nngwe", "Ke kgetha ho se bue"]
    # Opt-in demographic questions (DemographicQuestions::OPTIONAL_CARDS) —
    # map-shaped by demographic_key, NOT positional like cards above. Options
    # are only taken whole and at registry length; the last two neurodiversity
    # options are the mutually-exclusive pair in every language.
    optional:
      heritage:
        text: "Ke efe ho tsena e bontshang hantle ditso tsa hao?"
        description: "Setso sa hao sa merabe kapa moetlo."
        options: ["Ditso tsa Asia", "Ditso tsa batho ba batsho, Afrika kapa Caribbean", "Kihispania kapa Kilatino", "Ditso tsa Bochabela bo Hare kapa Leboya la Afrika", "Ditso tsa basweu kapa Yuropa", "Ditso tsa matsholla a naha", "Ditso tse tswakaneng kapa tse ngata", "Ditso tse ding", "Ke kgetha ho se bue"]
      neurodiversity:
        text: "Na ho na le tse ding tsena tse o hlalosang?"
        description: "Ka kamoo o nahanang le ho sebetsana le tlhaiso-leseling — kgetha tsohle tse sebetsang ho wena."
        options: ["ADHD", "Autism (Bosonyi)", "Dyslexia", "Dyspraxia", "Dyscalculia", "Tourette's", "Mofuta o mong wa kelello e fapaneng", "Ha ho le e nngwe ya tsena", "Ke kgetha ho se bue"]
    # The optional postcode field on the "Where do you live?" card
    # (Survey#capture_postcode?) — not part of the cards/optional registries
