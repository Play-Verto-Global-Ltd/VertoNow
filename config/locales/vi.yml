          open_ended: "Cho mọi người trả lời bằng lời của chính mình — tín hiệu định tính phong phú nhất, nhưng khó tổng hợp hơn."
          select_one_grid: "Đổi trích dẫn thô lấy các nhóm trực quan nhanh, so sánh được — chọn kiểu này nếu bạn đã biết những câu trả lời khả dĩ."
          range: "Chỉ hiệu quả nếu câu trả lời quy về một thang đo duy nhất — thường làm mất ý nghĩa của câu hỏi mở."
