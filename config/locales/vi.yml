    brand_panel_desc: Bảng phương tiện của mỗi thẻ
    s6_eyebrow: Bước 06 · Bối cảnh
    optional: Tùy chọn
    s6_lead: Còn gì khác chúng tôi nên đưa vào không?
    s6_body: Giọng điệu, câu hỏi bắt buộc, điều cần tránh, đặc điểm khán giả. Bỏ qua nếu không có gì thêm.
    s6_examples:
    - Phải bao gồm câu hỏi về các kênh tài trợ và rào cản đối với các khoản tài trợ.
    - Tránh dùng thuật ngữ chuyên ngành — nhiều người trả lời nói tiếng Anh như ngôn ngữ thứ hai.
    - Giữ giọng điệu ấm áp, không quá doanh nghiệp.
    s6_title: Còn gì khác chúng tôi nên biết?
    s6_placeholder: 'ví dụ: Khán giả chưa từng dùng Playverto, giữ giọng điệu ấm áp, không quá doanh nghiệp.'
    s6_compare_label: Cho phép người trả lời so sánh câu trả lời của họ
    s6_compare_desc: Hiển thị CTA trên trang cảm ơn để cho thấy câu trả lời của họ so sánh thế nào với mọi người khác.
    quiz_label: "Biến thành câu đố"
    quiz_desc: "Đánh dấu câu trả lời đúng hoặc sai, cho người chơi thấy điểm của họ, và để họ so sánh với người khác. Bạn đặt câu trả lời đúng sau khi tạo."
    s7_eyebrow: Bước 07 · Hoàn thiện
    s7_lead: Mở với giao diện Verto hoàn chỉnh hoặc một trang trắng tuỳ ý.
    s7_body: Chúng tôi chọn hình nền và hình ảnh cho từng thẻ từ thư viện được tuyển chọn — phù hợp với chủ đề, đối tượng và câu hỏi trên mỗi thẻ của bạn.
    s7_perks_label: Lợi ích của tính năng điền nội dung
    s7_perks:
    - Hình nền khớp với chủ đề của bạn
    - Hình ảnh trên mỗi thẻ, bao gồm cả thẻ vuốt
    - "Xáo trộn hình ảnh trong trình chỉnh sửa cho đến khi ưng ý"
    s7_title: Bạn muốn bắt đầu như thế nào?
    s7_sub: Bạn vẫn có thể thay đổi bất kỳ nội dung nào trong trình chỉnh sửa.
    s7_recommended: Được đề xuất
    s7_populate_label: Điền nội dung
    s7_populate_desc: Mở trình chỉnh sửa với hình nền và hình ảnh trên mỗi thẻ, phù hợp với thông tin bạn đã cung cấp.
    s7_blank_label: "Bắt đầu mới"
    s7_blank_desc: "Mở trình chỉnh sửa trống và thêm hình ảnh của riêng bạn, từng thẻ một."
