          yes_no: "Rút thang đo còn hai câu trả lời — phần lớn tín hiệu cũng mất theo. Chỉ dùng nếu nhị phân chính là điều bạn cần biết."
        yes_no:
          yes_no: "Tín hiệu rõ ràng khi bạn thực sự cần nhị phân — dễ đọc và dễ trả lời."
          select_one_grid: "Thêm sắc thái với vài lựa chọn trực quan được định sẵn — tốt hơn khi 'có/không' đang che mất câu trả lời thật."
          range: "Thêm thang 5 điểm với nhân vật hoạt hình phản ứng — tốt hơn khi mức độ quan trọng và bạn muốn hình ảnh cuốn hút."
          nps: "Thêm thang dọc 0–10 gọn gàng — tốt hơn khi mức độ quan trọng hơn nhị phân."
          tap_card: "Chạy nhanh có/không trên vài phát biểu cùng lúc — chỉ đổi nếu bạn có nhiều phát biểu để thử."
