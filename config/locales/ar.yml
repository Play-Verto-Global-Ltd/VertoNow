    s6_lead: هل هناك أي شيء آخر ينبغي أن ندمجه؟
    s6_body: النبرة، الأسئلة الضرورية، الأشياء التي يجب تجنبها، خصوصيات الجمهور. تخطَّ إن لم يكن هناك شيء إضافي.
