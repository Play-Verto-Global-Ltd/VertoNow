    nps:
      name: "صافي نقاط الترويج (NPS)"
      tagline: "قِس الولاء بسؤالين — ما مدى احتمال أن يوصي بك الناس، ولماذا."
      cards:
        - text: "سؤال سريع عن تجربتك"
          description: "أقل من دقيقة، ومجهول الهوية تمامًا — إجاباتك تساعدنا على التحسّن."
        - text: "ما مدى احتمال أن توصي بنا صديقًا أو زميلًا؟"
        - text: "ما السبب الرئيسي لتقييمك؟"
        - text: "أيٌّ من هذه الأوصاف يصفك بشكل أفضل؟"
          options: ["عميل جديد", "عميل متكرر", "عميل منذ فترة طويلة", "أتصفح فقط"]
    csat:
      name: "رضا العملاء (CSAT)"
      tagline: "نبضة CSAT قصيرة: قيّم التجربة، وحدّد ما نجح، وأخبرنا بما يجب إصلاحه."
      cards:
        - text: "كيف كان أداؤنا؟"
          description: "بضع نقرات سريعة — شكرًا لمساعدتنا على التحسّن."
        - text: "بشكل عام، ما مدى رضاك عن تجربتك؟"
          options: ["غير راضٍ إطلاقًا", "غير راضٍ", "محايد", "راضٍ", "راضٍ جدًا"]
        - text: "أي جزء من تجربتك كان الأبرز؟"
          options: ["سهولة الاستخدام", "السرعة", "الدعم", "القيمة مقابل المال", "الجودة"]
        - text: "هل ستستخدمنا مرة أخرى؟"
        - text: "ما الشيء الوحيد الذي يمكننا تحسينه؟"
    onboarding:
      name: "تهيئة المستخدمين الجدد"
      tagline: "اكتشف أين يتعثر المستخدمون الجدد وما الذي يساعدهم على تحقيق أول نجاح لهم أسرع."
      cards:
        - text: "كيف كانت البداية؟"
          description: "لقد أنهيت الإعداد للتو — أخبرنا كيف سارت الأمور وهي لا تزال حاضرة في ذهنك."
        - text: "ما مدى سهولة البدء؟"
          options: ["صعب جدًا", "صعب", "مقبول", "سهل", "سهل جدًا"]
        - text: "أين تعثرت، إن حدث ذلك؟"
          options: ["عند التسجيل", "عند الإعداد", "عند البحث عمّا أحتاجه", "عند فهم طريقة العمل", "لم أتعثر"]
        - text: "ما الذي كان سيساعدك على البدء أسرع؟ اختر كل ما ينطبق."
          options: ["جولة إرشادية", "قوالب أو أمثلة", "تعليمات أوضح", "دعم عبر الدردشة المباشرة", "فيديو قصير"]
        - text: "لو استطعت تغيير شيء واحد في تجربة البدء، فماذا سيكون؟"
    employee-pulse:
      name: "نبض الموظفين"
      tagline: "قراءة سريعة ومجهولة الهوية لشعور الفريق الحقيقي هذا الأسبوع — بالإضافة إلى eNPS."
      cards:
        - text: "كيف تسير الأمور، بصراحة؟"
          description: "مجهول الهوية تمامًا — الهدف هو تحسين الأمور، لا المراقبة."
        - text: "كيف تشعر تجاه العمل هذا الأسبوع؟"
          options: ["أعاني", "لست على ما يرام", "مقبول", "جيد", "في أفضل حال"]
        - text: "كيف هو عبء العمل لديك الآن؟"
          options: ["أكثر من اللازم بكثير", "أكثر من اللازم قليلًا", "مناسب تمامًا", "أقل من اللازم قليلًا", "أقل من اللازم"]
        - text: "ما مدى شعورك بدعم مديرك لك؟"
          options: ["لا أشعر بالدعم إطلاقًا", "قليلًا", "إلى حد ما", "بشكل جيد", "بشكل ممتاز"]
        - text: "ما مدى احتمال أن توصي بهذا المكان للعمل؟"
        - text: "ما التغيير الوحيد الذي سيجعل هذا مكان عمل أفضل؟"
    event-feedback:
      name: "تقييم الفعالية"
      tagline: "اعرف كيف كان وقع فعاليتك — أبرز اللحظات، وما لم ينجح، وهل سيعودون مجددًا."
      cards:
        - text: "شكرًا لحضورك — كيف كانت؟"
          description: "بضعة أسئلة سريعة وهي لا تزال حاضرة في ذهنك."
        - text: "كيف تقيّم الفعالية بشكل عام؟"
          options: ["ضعيفة", "مقبولة", "جيدة", "رائعة", "ممتازة"]
        - text: "ما أفضل جزء بالنسبة لك؟"
          options: ["المتحدثون", "المحتوى", "التواصل مع الآخرين", "المكان", "التنظيم"]
        - text: "هل ستحضر مرة أخرى؟"
        - text: "ما مدى احتمال أن توصي زميلًا بهذه الفعالية؟"
        - text: "ما الذي سيجعل الفعالية القادمة أفضل؟"
    product-market-fit:
      name: "ملاءمة المنتج للسوق"
      tagline: "اختبار شون إليس الكلاسيكي — كيف سيشعر الناس من دونك، ومن يقدّرك أكثر."
      cards:
        - text: "ساعدنا في رسم خطواتنا القادمة"
          description: "بضع إجابات صادقة تُحدث فرقًا حقيقيًا — شكرًا لك."
        - text: "كيف ستشعر لو لم يعد بإمكانك استخدامنا؟"
