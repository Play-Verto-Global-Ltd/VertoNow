  welcome_mailer:
    subject: "مرحبًا بك في Playverto — لنُنشئ أول Verto لك"
    heading: "كل شيء جاهز"
    intro: "تم تأكيد بريدك الإلكتروني. الـ Verto استبيان يسعد الناس بالإجابة عنه: بطاقات يتنقلون بينها باللمس، لا استمارة يتحمّلونها. وأسرع طريقة لرؤية ذلك هي البدء من قالب وتغيير الأسئلة."
    cta: "ابدأ من قالب"
    step_one: "اختر قالبًا، أو صِف ما تريد معرفته ودع Playverto يصوغ الأسئلة."
    step_two: "عدِّل أي بطاقة. تُظهر لك درجة Verto على اليمين ما ينجح وما لا ينجح."
    step_three: "انشر الاستبيان ثم شارك الرابط أو رمز الاستجابة السريعة. تصل النتائج تباعًا مع إجابات الناس."
    footer: "سجّلت الدخول من مكان آخر؟ لوحتك موجودة دائمًا هنا:"
    sent_by: "أُرسلت بواسطة Playverto"
