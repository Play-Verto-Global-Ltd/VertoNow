    # Per-template CONTENT, mirrored positionally from SurveyTemplates::ALL —
    # instantiating a template resolves these in the creator's locale, so the
    # new Verto starts in their language. Card entries align by index; an
    # `options` list must keep the registry card's length (positional answer
    # data). NPS number scales are not listed — numerals stay numerals.
    nps:
      name: "Izinga Lokuncoma"
      tagline: "Linganisa ukwethembeka ngemibuzo emibili — ukuthi kungakanani ukuthi abantu bangakuncoma, futhi kungani."
      cards:
        - text: "Umbuzo osheshayo mayelana nolwazi lwakho"
          description: "Ngaphansi komzuzu owodwa, ngokungaziwa ngokuphelele — izimpendulo zakho zisisiza sithuthuke."
        - text: "Kungakanani ukuthi ungasincoma kubangani noma ozakwenu?"
        - text: "Yini eyinto eyinhloko yamaphuzu akho?"
        - text: "Yikuphi kulokhu okukuchaza kahle?"
          options: ["Ikhasimende elisha", "Ikhasimende elibuyayo", "Ikhasimende lesikhathi eside", "Ngiyabuka nje"]
    csat:
      name: "Ukwaneliseka Kwamakhasimende"
      tagline: "Ukuhlola okufushane kwe-CSAT: linganisa ulwazi, khomba okusebenzile, futhi uzwe okumele kulungiswe."
      cards:
        - text: "Sisebenze kanjani?"
          description: "Imibuzo embalwa esheshayo — siyabonga ngokusisiza sithuthuke."
        - text: "Ngokubanzi, waneliseke kangakanani ngolwazi lwakho?"
          options: ["Angikaneliseki neze", "Angikaneliseki", "Ngikhona hlangothini", "Ngiyaneliseka", "Ngiyaneliseka kakhulu"]
        - text: "Yisiphi isigaba solwazi lwakho esivele kakhulu?"
          options: ["Ukulula kokusebenzisa", "Ijubane", "Usizo", "Inani lemali", "Ikhwalithi"]
        - text: "Ungasisebenzisa futhi?"
        - text: "Yini eyodwa esingayenza kangcono?"
    onboarding:
      name: "Ukwamukela Abasebenzisi Abasha"
      tagline: "Thola lapho abasebenzisi abasha bekwama khona nokuthi yini engabasiza bafinyelele ekunqobeni kwabo kokuqala ngokushesha."
      cards:
        - text: "Ukuqala kwakunjani?"
          description: "Usanda kusetha izinto — sitshele ukuthi kuhambe kanjani kusesemusha engqondweni."
        - text: "Bekulula kangakanani ukuqala?"
          options: ["Kunzima kakhulu", "Kunzima", "Kulungile", "Kulula", "Kulula kakhulu"]
        - text: "Uke wema kuphi, uma ukhona?"
          options: ["Ukubhalisa", "Ukusetha izinto", "Ukuthola engikudingayo", "Ukuqonda ukuthi kusebenza kanjani", "Angikaze ngime"]
        - text: "Yini ebingasiza uqale ngokushesha? Khetha konke okufanele."
          options: ["Uhambo oluqondisiwe", "Izifanekiso noma izibonelo", "Imiyalelo ecacile kakhulu", "Usizo lwengxoxo yangqo", "Ividiyo emfushane"]
        - text: "Ukube ungashintsha into eyodwa mayelana nokuqala, ngabe kungaba yini?"
    employee-pulse:
      name: "Ukuhlola Imizwa Yabasebenzi"
      tagline: "Ukufunda okusheshayo, okungaziwa, kwendlela ithimba elizizwa ngayo ngempela kuleli viki — ndawonye ne-eNPS."
      cards:
        - text: "Kuhamba kanjani, ngempela?"
          description: "Ngokungaziwa ngokuphelele — lokhu kumayelana nokwenza izinto zibengcono, hhayi ukuqapha."
        - text: "Uzizwa kanjani ngomsebenzi kuleli viki?"
          options: ["Ngiyabhukuda", "Akukuhle", "Kulungile", "Kuhle", "Ngiyachuma"]
        - text: "Umthwalo womsebenzi wakho unjani okwamanje?"
          options: ["Muningi kakhulu", "Muningi kancane", "Ulinganile", "Mulula kancane", "Mulula kakhulu"]
        - text: "Uzizwa usekelwe kangakanani umphathi wakho?"
          options: ["Nhlobo", "Kancane", "Kuthile", "Kahle", "Kahle kakhulu"]
        - text: "Kungakanani ukuthi ungancoma lapha njengendawo yokusebenza?"
        - text: "Yiluphi ushintsho olulodwa olungenza lapha kube yindawo engcono yokusebenza?"
    event-feedback:
      name: "Impendulo Ngomcimbi"
      tagline: "Thatha indlela umcimbi wakho oye wamukeleka ngayo — okuhle, okushodile, nokuthi bangabuya futhi yini."
      cards:
        - text: "Siyabonga ngokuza — bekunjani?"
          description: "Imibuzo embalwa esheshayo kusesemusha engqondweni."
        - text: "Ungawulinganisa kanjani umcimbi ngokubanzi?"
          options: ["Kubi", "Kuyenele", "Kuhle", "Kuhle kakhulu", "Okuhle ngempela"]
        - text: "Yisiphi isigaba esibe ngesihle kakhulu kuwe?"
          options: ["Izikhulumi", "Okuqukethwe", "Ukwakha amanethiwekhi", "Indawo", "Uhlelo"]
        - text: "Ungeza futhi?"
        - text: "Kungakanani ukuthi ungancoma lo mcimbi kozakwenu?"
        - text: "Yini engaphakathi kwakho olandelayo ibe ngcono?"
    product-market-fit:
      name: "Ukuhambisana Komkhiqizo Nemakethe"
      tagline: "Ukuhlolwa okudumile kuka-Sean Ellis — indlela abantu abangazizwa ngayo ngaphandle kwakho, nokuthi ubani okuvalela kakhulu."
      cards:
        - text: "Siza ukwakha lapho siya khona"
          description: "Izimpendulo ezimbalwa eziqotho zenza umehluko wangempela — siyabonga."
        - text: "Ubungazizwa kanjani ukube ubungasakwazi ukusisebenzisa?"
          options: ["Bengizoda ngokuphelele", "Bengizoda kancane", "Bengingeke ngikhathazeke"]
        - text: "Iyini inzuzo eyinhloko oyithola kithi?"
        - text: "Ucabanga ukuthi uhlobo luni lomuntu oluzozuza kakhulu?"
          options: ["Abantu abanjengami", "Abaqalayo", "Ochwepheshe", "Amaqembu", "Angiqiniseki"]
        - text: "Singayithuthukisa kanjani ngokwakho?"
  # The three set demographic questions appended to every Verto (see
  # DemographicQuestions) — resolved in the Verto's default locale at append
  # time, so a French Verto's tail asks in French. Positional; options keep
  # the registry lengths.
  demographics:
    cards:
      - text: "Uneminyaka emingaki?"
        options: ["Ngaphansi kuka-16", "16–17", "18–24", "25–34", "35–49", "50–64", "65+"]
      - text: "Uhlala kuphi?"
        description: "Kunikwa amandla yi-OpenStreetMap — kusiza ukwakha ibalazwe ongalicwaninga ngemva kokuqeda."
      - text: "Yibuphi ubulili obukuchaza kangcono?"
        options: ["Owesilisa", "Owesifazane", "Ongewesilisa nowesifazane", "Okunye", "Ngithanda ukungasho"]
    # Opt-in demographic questions (DemographicQuestions::OPTIONAL_CARDS) —
    # map-shaped by demographic_key, NOT positional like cards above. Options
    # are only taken whole and at registry length; the last two neurodiversity
    # options are the mutually-exclusive pair in every language.
    optional:
      heritage:
        text: "Yikuphi kulokhu okuveza kahle ifa lakho?"
        description: "Isizinda sakho sobuzwe noma samasiko."
        options: ["Ifa lase-Asia", "Ifa labamnyama, base-Afrika noma base-Caribbean", "Elase-Hispanic noma Latino/a", "Ifa laseMpumalanga Ephakathi noma eNyakatho Afrika", "Ifa labamhlophe noma base-Europe", "Ifa lomdabu", "Ifa elixubile noma eziningi", "Elinye ifa", "Ngithanda ukungasho"]
      neurodiversity:
        text: "Ikhona kulokhu okukuchazayo?"
        description: "Mayelana nendlela ocabanga futhi ucubungula ulwazi ngayo — khetha konke okufanele."
        options: ["I-ADHD", "Ubunsonge (Autism)", "I-Dyslexia", "I-Dyspraxia", "I-Dyscalculia", "I-Tourette's", "Olunye uhlobo lokungafani kobuchopho", "Akukho kulokhu", "Ngithanda ukungasho"]
    # The optional postcode field on the "Where do you live?" card
    # (Survey#capture_postcode?) — not part of the cards/optional registries
    # above since it isn't a question of its own, just an extra field on the
    # location card.
    postcode_placeholder: "Ikhodi yeposi (akudingekile)"
    postcode_note: "Isetshenziselwa kuphela ukuqonda amaphethini ezifunda ngokubanzi — ayikaze iboniswe ngokomuntu ngamunye."
