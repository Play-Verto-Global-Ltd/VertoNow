    step_two: "Hlela noma yikuphi ikhadi. Amaphuzu e-Verto ngakwesokudla akutshela okusebenzayo nokungasebenziyo."
    step_three: "Shicilela, bese wabelana ngesixhumanisi noma ikhodi yaso ye-QR. Imiphumela ingena njengoba abantu bephendula."
