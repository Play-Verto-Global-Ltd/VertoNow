    welcome_ready_html: "Cindezela u-<strong style=\"color:rgba(0,0,0,0.6);\">Okulandelayo</strong> uma usukulungele."
    examples: "Izibonelo"
    s1_eyebrow: "Isinyathelo 01 · Mayelana ne-Verto yakho"
    s1_lead: "Isihloko esisodwa esikhulu esifaka konke."
    s1_body: "Sigcine sibanzi — uzobanga umqondo ezinyathelweni ezilandelayo. Igama elilodwa noma amabili ngokuvamile kwanele."
    s1_examples:
      - "Isenzo sesimo sezulu"
      - "Imfundo yababaleki"
      - "Ukuvikeleka kokudla"
    s1_title: "I-Verto yakho imayelana nani?"
    s1_placeholder: "isb. Impilo enhle yentsha"
    s1_hint_body: "Sigcine sibanzi — uzobanga umqondo ezinyathelweni ezilandelayo."
    s2_eyebrow: "Isinyathelo 02 · Ngubani ophendulayo"
    s2_lead: "Iminyaka kuqala — bese kulandela indawo nomongo."
    s2_body: "Qala ngebanga labo leminyaka, bese wengeza lapho bekhona nabakwenzayo. '25–40 abahlengikazi eManchester' kungcono kunoku 'abantu abadala' — iminyaka, indawo, indima, ulimi kanye nesitayela sokuphila konke kucija imibuzo esiyibhalayo."
    s2_examples:
      - "Abafundi bekolishi abaneminyaka engu-18–24 eKenya"
      - "Abasebenzi bezempilo baseceleni benhlangano abaneminyaka engu-35–55"
      - "Abazali babantwana besikole basemakhaya eNSW"
    s2_title: "Ngubani ophendulayo — futhi baneminyaka emingaki?"
    s2_placeholder: "isb. Abafundi bekolishi abaneminyaka engu-18–24 eKenya"
    s2_hint_body: "Isitayela sokuphila, indima, isifunda, ulimi — noma yini eyakha indlela leli qembu elicabanga ngayo."
    s3_eyebrow: "Isinyathelo 03 · Umgomo wokufunda"
    s3_lead: "Umbono ongashintsha isinqumo."
    s3_body: "Yeqa izinto osuvele uzazi. Hlosa into eyodwa okuthi, uma uyifunda, izoshintsha lokho okwenzayo emva kwalokho."
    s3_examples:
      - "Kungani abavolontiya beyeka ngemva kwenyanga yesithathu?"
      - "Yini evimba abantu ukuthi bafinyelele ebhange lethu lokudla?"
      - "Ingabe uhlelo lwethu lwentsha luyashintsha impela ukuzethemba — futhi kuphi ngempela?"
    s3_title: "Ufuna ukufundani kubona?"
    s3_placeholder: "isb. Kungani abavolontiya beyeka ngemva kwenyanga yesithathu?"
    s3_hint_body: "Yeqa lokho osuvele ukwazi — hlosa into eyodwa engashintsha lokho okwenzayo emva kwalokho."
    s4_eyebrow: "Isinyathelo 04 · Izilimi"
    s4_lead: "Fikelela wonke umuntu ngolimi lwakhe."
    s4_body: "Sizobhala i-Verto ngolimi lwakho oluyinhloko, bese siklama inguqulo elinganayo kabuhle kolunye ulimi ngalunye. Inguqulo ngayinye ibuza imibuzo efanayo, ngakho imiphumela ihlala ihambisana."
    s4_title: "Yiziphi izilimi le-Verto okufanele izikhulume?"
    s4_primary_label: "Ulimi oluyinhloko"
    s5_eyebrow: "Isinyathelo 06 · Ukuthinta kokugcina"
    s5_lead: "Ukuthinta okumbalwa kokugcina."
    s5_body: "Khetha indlela othanda ukuqala ngayo kanye nombalabhrendi. Ukubuka kuqala kukhombisa indlela i-Verto yakho ezozwakala ngayo."
