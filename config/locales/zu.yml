  welcome_mailer:
    subject: "Wamukelekile ku-Playverto — ake sakhe i-Verto yakho yokuqala"
    heading: "Konke sekulungile"
    intro: "I-imeyili yakho isiqinisekisiwe. I-Verto uwucwaningo abantu abawuthanda ngempela ukuwuphendula — amakhadi abawathephayo esikhundleni sefomu abakhuthazelayo. Indlela esheshayo yokubona olunye ukuqala ngesifanekiso bese ushintsha imibuzo."
