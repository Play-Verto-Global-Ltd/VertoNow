    heading_html: 'Qala nge-<span style="color:#615BF5;">sifanekiso</span>'
    subtitle: "Khetha i-Verto esesilungisiwe futhi uqale ukuqoqa imizuzu embalwa — isifanekiso ngasinye siyahleleka ngokugcwele."
    back: "Buyela edeshibhodini"
    import_instead: "Usunayo imibuzo? Yingenise kunalokho →"
