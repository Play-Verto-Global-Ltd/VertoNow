    intro: "Imeyili yako yasimbiswa. Verto iongororo yavanhu vanofarira kupindura chaizvo — makadhi avanodzvanya kupfuura fomu yavanotsungirira. Nzira inokurumidza yekuona imwe ndeyekutanga netembheti wozochinja mibvunzo."
