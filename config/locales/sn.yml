    examples: "Mienzaniso"
    s1_eyebrow: "Danho 01 · Nezve Verto Yako"
    s1_lead: "Musoro mumwe chete unofukidza zvose."
    s1_body: "Chiite chakapamhama — uchachidzikisira mudanho anotevera. Izwi rimwe kana maviri kazhinji zvinokwana."
    s1_examples:
