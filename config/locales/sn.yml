    s1_placeholder: "semuenzaniso, Upenyu Hwakanaka hweVechidiki"
    s1_hint_body: "Chiite chakapamhama — uchachidzikisira mudanho anotevera."
    s2_eyebrow: "Danho 02 · Anopindura"
    s2_lead: "Zera pakutanga — wozoisa nzvimbo nemamiriro."
    s2_body: "Tanga nechiyero chezera ravo, wozowedzera kwavari uye zvavanoita. 'Mainesi ane makore 25–40 muManchester' ndizvo zvirinani pane 'vanhu vakuru' — zera, nzvimbo, basa, mutauro nemagariro zvose zvinopinza mibvunzo yatinonyora."
    s2_examples:
      - "Vadzidzi vezvidzidzo zvepamusoro vane makore 18–24 kuKenya"
      - "Vashandi vehutano hwenharaunda vane makore 35–55"
      - "Vabereki vevana vezera rechikoro kumaruwa eNSW"
    s2_title: "Ndiani Anopindura — Uye Vane Zera Ripi?"
    s2_placeholder: "semuenzaniso, Vadzidzi vezvidzidzo zvepamusoro vane makore 18–24 kuKenya"
    s2_hint_body: "Magariro, basa, dunhu, mutauro — chero chinhu chinoumba kufunga kweboka iri."
    s3_eyebrow: "Danho 03 · Chinangwa Chekudzidza"
    s3_lead: "Zivo inogona kuchinja sarudzo."
    s3_body: "Pfuura zvinhu zwaunotoziva. Nangira chinhu chimwe chete chinoti, kana ukachidzidza, chingachinja zvaunoita mberi."
    s3_examples:
      - "Nei vazvipiri vachisiya mushure memwedzi wechitatu?"
      - "Chii chinodzivisa vanhu kuwana bhangi redu rezvekudya?"
      - "Chirongwa chedu chevechidiki chinonyatsochinja chivimbo here — uye papi chaipo?"
