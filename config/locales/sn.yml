    s3_hint_body: "Pfuura zwaunotoziva — nangira chinhu chimwe chete chingachinja zvaunoita mberi."
    s4_eyebrow: "Danho 04 · Mitauro"
    s4_lead: "Svika kuvanhu vose mumutauro wavo."
    s4_body: "Tichanyora Verto mumutauro wako mukuru, wotogadzira vhezheni yakanaka zvakaenzana mumutauro mumwe nemumwe. Vhezheni imwe neimwe inobvunza mibvunzo yakafanana, saka mhedzisiro inoramba yakaenzana."
