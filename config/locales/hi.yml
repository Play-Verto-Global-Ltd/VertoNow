        - text: "किस चीज़ से आपकी शुरुआत और तेज़ हो सकती थी? जो-जो लागू हों, सब चुनें।"
          options: ["एक गाइडेड टूर", "टेम्पलेट या उदाहरण", "ज़्यादा स्पष्ट निर्देश", "लाइव चैट सहायता", "एक छोटा वीडियो"]
        - text: "अगर आप शुरुआत के अनुभव में एक चीज़ बदल सकते, तो वह क्या होती?"
