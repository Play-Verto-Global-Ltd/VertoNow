          description: "एक मिनट से भी कम, पूरी तरह गुमनाम — आपके जवाब हमें बेहतर बनने में मदद करते हैं।"
        - text: "इसकी कितनी संभावना है कि आप हमें किसी दोस्त या सहकर्मी को सुझाएँगे?"
