          multiple_choice: "कहानी की बुनावट छोड़कर सादी एकल-चुनाव सूची — बदलें अगर कहानी का संदर्भ कुछ नहीं जोड़ रहा।"
          yes_no: "इसे कोरे हाँ/नहीं तक घटा देता है — तभी जब कहानी सचमुच हाँ/नहीं में सिमटती हो।"
        range:
          range: "भावना की तीव्रता पकड़ने में सबसे अच्छा, और प्रतिक्रिया देता एनिमेटेड किरदार उत्तर देना सुखद बना देता है — साफ़ वितरण और आकर्षक विज़ुअल, दोनों।"
          nps: "कॉम्पैक्ट खड़े स्लाइडर पर क्लासिक 0–10 स्केल — एनिमेशन के बिना, शांत और पारंपरिक अंदाज़ के लिए बदलें।"
          rating: "मिलती-जुलती बनावट, पर सितारे ज़्यादा जाने-पहचाने और थोड़े कम अभिव्यंजक हैं।"
          tap_card: "स्केल की जगह हर कथन पर हाँ/नहीं — ज़्यादा दिलचस्प, कम बारीक।"
          yes_no: "स्केल को दो उत्तरों में समेट देता है — ज़्यादातर डेटा उसी के साथ चला जाता है। तभी अपनाएँ जब हाँ/नहीं ही असली इनसाइट हो।"
