    s2_body: "उम्र की सीमा से शुरू करें, फिर बताएँ वे कहाँ हैं और क्या करते हैं। «मैनचेस्टर की 25–40 नर्सें» «वयस्कों» से बेहतर है — उम्र, जगह, भूमिका, भाषा और जीवनशैली से सवाल और सटीक बनते हैं।"
