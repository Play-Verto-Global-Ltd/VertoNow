      tagline: "イベントの手応えを把握 — 良かった点、物足りなかった点、また来たいかどうか。"
      cards:
        - text: "ご来場ありがとうございました — いかがでしたか？"
          description: "記憶が新しいうちに、いくつか簡単な質問にお答えください。"
        - text: "イベント全体をどのように評価しますか？"
          options: ["悪い", "まあまあ", "良い", "とても良い", "素晴らしい"]
        - text: "一番良かったのはどの部分でしたか？"
