        - text: "今週の仕事についてどう感じていますか？"
          options: ["つらい", "あまり良くない", "ふつう", "良い", "絶好調"]
        - text: "今の仕事量はどうですか？"
          options: ["多すぎる", "やや多い", "ちょうどいい", "やや少ない", "少なすぎる"]
        - text: "上司からのサポートをどの程度感じていますか？"
          options: ["まったく感じない", "少し感じる", "ある程度感じる", "十分感じる", "とても感じる"]
        - text: "ここを働く場所としてすすめる可能性はどのくらいありますか？"
        - text: "ここをより良い職場にする変化を1つ挙げるとしたら何ですか？"
