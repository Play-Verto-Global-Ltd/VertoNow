  # The three set demographic questions appended to every Verto (see
  # DemographicQuestions) — resolved in the Verto's default locale at append
  # time, so a French Verto's tail asks in French. Positional; options keep
  # the registry lengths.
  demographics:
    cards:
      - text: "How old are you?"
        options: ["Under 16", "16–17", "18–24", "25–34", "35–49", "50–64", "65+"]
      - text: "Where do you live?"
        description: "Powered by OpenStreetMap — helps build a map you can explore after finishing."
      - text: "What gender best describes you?"
        options: ["Male", "Female", "Non-binary", "Other", "Prefer not to say"]
    # Opt-in demographic questions (DemographicQuestions::OPTIONAL_CARDS) —
    # map-shaped by demographic_key, NOT positional like cards above. Options
    # are only taken whole and at registry length; the last two neurodiversity
    # options are the mutually-exclusive pair in every language.
    optional:
      heritage:
        text: "Which of these best reflects your heritage?"
        description: "Your ethnic or cultural background."
        options: ["Asian heritage", "Black, African or Caribbean heritage", "Hispanic or Latino/a", "Middle Eastern or North African heritage", "White or European heritage", "Indigenous heritage", "Mixed or multiple heritage", "Another heritage", "Prefer not to say"]
      neurodiversity:
        text: "Do any of these describe you?"
        description: "About how you think and process information — choose any that apply."
        options: ["ADHD", "Autism", "Dyslexia", "Dyspraxia", "Dyscalculia", "Tourette's", "Another form of neurodivergence", "None of these", "Prefer not to say"]
