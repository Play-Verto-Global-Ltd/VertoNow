    s1_placeholder: "umz. Impilo yolutsha"
    s1_hint_body: "Yigcine ibanzi — uya kucutha ingongoma kumanyathelo alandelayo."
    s2_eyebrow: "Inyathelo 02 · Ngubani ophendulayo"
    s2_lead: "Iminyaka kuqala — emva koko indawo nomxholo."
    s2_body: "Qala ngomda weminyaka yabo, uze wongeze apho bakhona nento abayenzayo. '25–40 abongikazi eManchester' bungcono kune 'abantu abadala' — iminyaka, indawo, indima, ulwimi nendlela yobomi konke kubukhali imibuzo esiyibhalayo."
    s2_examples:
      - "Abafundi bekholeji abaneminyaka eyi-18–24 eKenya"
      - "Abasebenzi bempilo yasekuhlaleni abaphambili abaneminyaka eyi-35–55"
      - "Abazali babantwana beminyaka yesikolo emaphandleni eNSW"
    s2_title: "Ngubani ophendulayo — kwaye baneminyaka emingaphi?"
    s2_placeholder: "umz. Abafundi bekholeji abaneminyaka eyi-18–24 eKenya"
    s2_hint_body: "Indlela yobomi, indima, ummandla, ulwimi — nantoni na ebumba indlela eli qela licinga ngayo."
    s3_eyebrow: "Inyathelo 03 · Injongo yokufunda"
    s3_lead: "Ingqiqo enokuguqula isigqibo."
    s3_body: "Yeka izinto osele uzaziyo. Jonga into enye ekuba ngathi ukuba uyifundile, iya kuguqula oko uyakwenza kamva."
    s3_examples:
      - "Kutheni abavolontiya bewa emva kwenyanga yesithathu?"
      - "Yintoni ethintela abantu ukufikelela kwibhanki yethu yokutya?"
      - "Ngaba inkqubo yethu yolutsha iyayiguqula ngokwenene inqubelo — kwaye kanye kanye phi?"
    s3_title: "Ufuna ukufunda ntoni kubo?"
    s3_placeholder: "umz. Kutheni abavolontiya bewa emva kwenyanga yesithathu?"
    s3_hint_body: "Yeka osele uyazi — jonga into enye ebeya kuguqula oko uyakwenza kamva."
