    s4_lead: "Fikelela wonke umntu ngolwimi lwakhe."
    s4_body: "Siya kubhala iVerto ngolwimi lwakho oluyintloko, size siyile uhlaziyo olulingana kakuhle kolunye ulwimi ngalunye. Uhlaziyo ngalunye lubuza imibuzo efanayo, ngoko iziphumo zihlala zithelekiseka."
