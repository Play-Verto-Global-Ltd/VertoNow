        - text: "Ingakanani indlela onokusicebisa ngayo kumhlobo okanye kumsebenzi wenu?"
        - text: "Yintoni esisizathu esiyintloko samanqaku akho?"
        - text: "Yeyiphi kwezi ekuchaza kakuhle?"
          options: ["Umthengi omtsha", "Umthengi obuyayo", "Umthengi wexesha elide", "Ndiyajonga nje"]
    csat:
      name: "Ukwaneliseka kwaBathengi"
      tagline: "Uvavanyo olufutshane lweCSAT: linganisela amava, khomba oko kusebenzileyo, uve nokufuneka kulungiswe."
      cards:
        - text: "Senze njani?"
          description: "Imibuzo embalwa ekhawulezayo — enkosi ngokusinceda siphucuke."
        - text: "Ngokubanzi, waneliseke kangakanani ngamava akho?"
          options: ["Andanelisekanga konke konke", "Andanelisekanga", "Andigqami", "Ndanelisekile", "Ndanelisekile kakhulu"]
        - text: "Yeyiphi inxalenye yamava akho eyagqama kakhulu?"
          options: ["Ukulula ukusetyenziswa", "Isantya", "Uxhaso", "Ixabiso lemali", "Umgangatho"]
        - text: "Ngaba ungaphinda usisebenzise?"
        - text: "Yintoni enye esinokuyenza ngcono?"
    onboarding:
      name: "Ukwamkelwa koMsebenzisi Omtsha"
      tagline: "Fumanisa apho abasebenzisi abatsha babambeleka khona nento eyakubanceda bafikelele kuloyiso lwabo lokuqala ngokukhawuleza."
      cards:
        - text: "Ukuqala kwaba njani?"
          description: "Usanda kuseta izinto — sixelele indlela ekuhambe ngayo ngoxa isesecaleni."
        - text: "Kwakulula kangakanani ukuqala?"
          options: ["Kwakunzima kakhulu", "Kwakunzima", "Kwakusenokwenzeka", "Kwakulula", "Kwakulula kakhulu"]
        - text: "Wabambeleka phi, ukuba wabambeleka?"
          options: ["Ukubhalisa", "Ukuseta izinto", "Ukufumana endikufunayo", "Ukuqonda indlela esebenza ngayo", "Andizange ndibambeleke"]
        - text: "Yintoni ebiya kukunceda ukuqala ngokukhawuleza? Khetha konke okufanelekileyo."
          options: ["Uhambo oluqhutywayo", "Izakhelo okanye imizekelo", "Imiyalelo ecacileyo", "Uncedo lwengxoxo yangoko", "Ividiyo emfutshane"]
        - text: "Ukuba ubunokutshintsha into enye ngokuqala, ibiyakuba yintoni?"
    employee-pulse:
      name: "Ukuhlola Imizwa yabaSebenzi"
      tagline: "Ukufunda ngokukhawuleza, okungaziwa, kwendlela iqela eliziva ngayo ngokwenene kule veki — kunye ne-eNPS."
      cards:
        - text: "Izinto zihamba njani, ngokwenene?"
          description: "Akwaziwa konke konke — oku kumalunga nokuphucula izinto, kungekhona ukujonga umntu."
        - text: "Uziva njani ngomsebenzi kule veki?"
          options: ["Ndiyasokola", "Akulunganga kakhulu", "Kusenokwenzeka", "Kulungile", "Ndiyavuthuza"]
        - text: "Umthwalo wakho womsebenzi unjani ngoku?"
          options: ["Mninzi kakhulu", "Mninzi kancinci", "Ulungile", "Mlula kancinci", "Mlula kakhulu"]
        - text: "Uziva uxhaswa kangakanani ngumphathi wakho?"
          options: ["Akukho konke konke", "Kancinci", "Kancinane", "Kakuhle", "Kakuhle kakhulu"]
        - text: "Ingakanani indlela onokucebisa ngayo apha njengendawo yokusebenza?"
        - text: "Loluphi utshintsho olunye olunokwenza apha kube yindawo engcono yokusebenza?"
    event-feedback:
      name: "Impendulo yoMsitho"
      tagline: "Bamba indlela umsitho wakho owaphunyelela ngayo — izinto ezigqamileyo, ezingaphumelelanga, nokuba babeya kubuya kwakhona."
      cards:
        - text: "Enkosi ngokuza — kwakunjani?"
          description: "Imibuzo embalwa ekhawulezayo ngoxa isesecaleni."
        - text: "Ungawulinganisela njani umsitho ngokubanzi?"
          options: ["Kubi", "Kuhle ngandlela ithile", "Kuhle", "Kukhulu", "Kugqwesile"]
        - text: "Yeyiphi inxalenye eyayelona ilungileyo kuwe?"
          options: ["Iintetho-bume", "Umxholo", "Ukwakha unxibelelwano", "Indawo", "Ulungiselelo"]
        - text: "Ngaba ungabuya kwakhona?"
        - text: "Ingakanani indlela onokucebisa ngayo lo msitho kumhlobo wakho?"
        - text: "Yintoni enokwenza olandelayo ube ngcono nangakumbi?"
    product-market-fit:
      name: "Ukufaneleka koVeliso kwiMarike"
      tagline: "Uvavanyo oludumileyo lukaSean Ellis — indlela abantu abaya kuziva ngayo ngaphandle kwakho, nokuba ngubani okuxabisa ngakumbi."
      cards:
        - text: "Nceda ubumbe apho siya khona"
          description: "Iimpendulo ezinyanisekileyo ezimbalwa zenza umahluko wokwenene — enkosi."
        - text: "Ubuya kuziva njani ukuba ubungasakwazi ukusisebenzisa?"
          options: ["Ndingadana kakhulu", "Ndingadana kancinane", "Andingadani"]
        - text: "Yintoni inzuzo eyintloko oyifumana kuthi?"
        - text: "Ucinga ukuba luhlobo luni lomntu oluya kuzuza kakhulu?"
          options: ["Abantu abanjengam", "Abaqalayo", "Ochwepheshe", "Amaqela", "Andiqinisekanga"]
        - text: "Sinokuyiphucula njani ngenxa yakho?"
