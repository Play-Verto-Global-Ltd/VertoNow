# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Report PDFs are disposable — the markdown they were built from is cached on
  # the Verto, so any of them can be re-rendered on demand. Without this they'd
  # accumulate on a 1GB disk for downloads nobody will repeat.
  sweep_report_renders:
    command: "ReportRender.sweepable.find_each(&:destroy)"
    schedule: every day at 4am

  # The Verto Integrity Score (ResponseIntegrity): each active Verto's timing
  # baseline refreshed, responses without signals banded, and every scored
  # response re-scored against the new baseline. One job per Verto that
  # collected anything in the last day, for the memory reason given below.
  # Before the Ask Verto refresh at 3am, so the index reads current bands.
  refresh_integrity_scores:
    command: "RescoreIntegrityJob.refresh_all!"
    schedule: every day at 2:30am

  # An approved Verto keeps collecting, so its Ask Verto index goes stale the day
  # after it is approved. This enqueues one job PER Verto rather than doing the
  # work here — Solid Queue runs inside Puma on a small instance, and one job
  # holding every contributed Verto's aggregation at once is exactly the memory
  # shape the watchdog restarts the process for.
  refresh_ask_verto_corpus:
    command: "IndexCorpusEntryJob.refresh_all!"
    schedule: every day at 3am

  # The safety net under Comms' set(wait_until:) scheduling: Solid Queue
  # rides inside Puma and the memory watchdog restarts Puma, so a scheduled
  # send's job can vanish and an in-flight batch can die mid-claim. The sweep
  # re-enqueues due campaigns, reaps stuck recipients, re-pokes stalled sends
  # and finalizes finished ones (all idempotent — claims make double-enqueues
  # harmless).
  comms_sweep:
    class: Comms::SweepJob
    schedule: every 5 minutes

  # The same safety net for free-text moderation: a screen lost to a restart
  # leaves a respondent's answer held with nothing coming for it. The sweep
  # re-enqueues stale pending texts, releases stale claims, and blanks removed
  # texts past their retention. All idempotent.
  moderation_sweep:
    class: SweepHeldTextsJob
    schedule: every 10 minutes

  # Books automation runs for newly-eligible subjects. Safe to re-run any
  # number of times: the runs ledger's UNIQUE idempotency key absorbs every
  # duplicate booking attempt.
  comms_enqueue_automations:
    class: Comms::EnqueueAutomationRunsJob
    schedule: every hour at minute 7

  # The only thing that reports traffic CLIMBING rather than something being
  # broken. Nobody watches a dashboard at 9pm three days after an event, and
  # the persistent disk pins this service to one instance, so nothing scales
  # itself in response — a human has to, and first has to know. The window in
  # TrafficAlertJob::WINDOW is kept equal to this schedule so runs neither
  # overlap nor leave gaps. Inert until TRAFFIC_ALERT_EMAILS is set.
  traffic_alert:
    class: TrafficAlertJob
    schedule: every 15 minutes

  # Thursday's newsletter DRAFT — it never sends, it only writes a draft for
  # the owner to review and book for Monday. Cron rather than English because
  # this is the file's only weekday-specific schedule; 4 is Thursday, in UTC.
  # Re-running is harmless: email_campaigns.newsletter_week is UNIQUE, so a
  # second run for the same week is a no-op.
  comms_generate_newsletter:
    class: Comms::GenerateNewsletterJob
    schedule: "0 7 * * 4"
