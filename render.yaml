services:
  - type: web
    name: survey-poc  # "VertoNowMain" in the dashboard; keep this field — renaming a blueprint service recreates it on a sync
    # The production image CI builds and pushes
    # (ghcr.io/play-verto-global-ltd/vertonow; build_image and deploy in
    # .github/workflows/ci.yml) — in the org's own namespace since the
    # repository moved there, so CI's GITHUB_TOKEN can write it without a
    # cross-account grant; ghcr.io/napps9/survey-poc holds every :<sha> from
    # before the move and is what a rollback past it pulls (DEPLOYMENT_RUNBOOK
    # §7). This reference is the dashboard's to change, not this file's — see
    # the note below about which one is the truth — image-backed since
    # 2026-09-13, in place of a source build on every deploy (2-3 minutes each;
    # a pull is about one). The image runs under jemalloc (installed in the
    # Dockerfile and enabled by bin/docker-entrypoint) instead of glibc malloc —
    # ~10-25% lower RSS and less fragmentation on the 512MB instance. The
    # entrypoint runs db:prepare on boot; the Dockerfile's CMD (rails server)
    # binds to $PORT via config/puma.rb. libvips is available for Active
    # Storage image variants.
    runtime: image
    image:
      url: ghcr.io/play-verto-global-ltd/vertonow:main
    # Live deployment facts (owner-confirmed 2026-09-01): the running web
    # service and database are BOTH in Frankfurt (EU Central) — this file
    # previously said oregon, which was stale against reality. A blueprint
    # that lies about region is exactly what recreates a service on the
    # wrong continent during an incident; keep these fields matching the
    # dashboard.
    plan: starter
    region: frankfurt
    # How a commit reaches this service (the deploy job in
    # .github/workflows/ci.yml): every Main run pushes :<sha>; once every
    # check is green, the deploy job moves :main onto that sha and POSTs this
    # service's Deploy Hook with imgURL naming it. So :main is always the last
    # green commit, and the dashboard's Manual Deploy > "Deploy latest
    # reference" deploys that (not what to press after a dashboard rollback:
    # :main still names the build rolled back from until a fix-forward lands).
    # An image-backed service has no auto-deploy and no branch — the hook is
    # the only automated path — so neither `branch` nor `autoDeployTrigger`
    # belongs here. History: as a source build, Render's
    # checksPass trigger was seen starting a deploy an hour after the checks
    # passed (2026-08-12, 89802a7), and the dashboard had it on regardless of
    # this file — 80205d0 deployed twice on 2026-09-13. Moot now.
    #
    # This service is not blueprint-managed (the dashboard has disagreed with
    # this file before): the dashboard is the truth, this file the record. The
    # switch itself is written up in docs/DEPLOYMENT_RUNBOOK.md §7.
    healthCheckPath: /up
    # Runs once against a fresh instance before it's swapped into rotation -
    # not on every boot like bin/docker-entrypoint's own db:prepare still
    # does today. This is step 1 of a 2-step migration (see
    # docs/DEPLOYMENT_RUNBOOK.md and PRODUCTION_READINESS_PLAN.md P1-4):
    # once this is confirmed running in the Render deploy log, a follow-up
    # change removes db:prepare from the entrypoint so a bad migration
    # blocks the deploy (old instance keeps serving) instead of taking the
    # running instance down on its next restart. Redundant but harmless
    # until then - db:prepare is idempotent.
    # DB_STATEMENT_TIMEOUT lifts the app's 30s statement bound
    # (config/database.yml) for migrations only — an index build on a big
    # responses table legitimately takes longer than a request query ever may.
    preDeployCommand: DB_STATEMENT_TIMEOUT=600s bundle exec rails db:prepare
    # Persistent disk for Active Storage (organisation logos + the per-account
    # brand asset library). config.active_storage.service = :local writes to
    # Rails.root/storage = /rails/storage (WORKDIR is /rails), so the disk is
    # mounted exactly there — without it the container filesystem is ephemeral
    # and every deploy wipes uploaded images. NOTE: attaching a disk pins the
    # service to a single instance and swaps zero-downtime deploys for a brief
    # stop/start (fine here — already WEB_CONCURRENCY=1 on starter). The disk is
    # NOT available during build/pre-deploy, only at runtime (entrypoint on).
    # POST-CUTOVER: this block is the LAST thing to go (docs/OBJECT_STORAGE_CUTOVER.md,
    # phase 3) — removing the disk is what un-pins the service from one
    # instance, and it destroys the disk's contents. Never remove it before
    # `bin/rails object_storage:verify` passes on production with the app
    # already running on the bucket.
    disk:
      name: storage
      mountPath: /rails/storage
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      # Single-mode Puma (no cluster workers): one Ruby process runs the web
      # threads AND Solid Queue's threads (solid_queue_mode :async in
      # config/puma.rb). The old value of 1 ran cluster mode — a master plus a
      # duplicate worker process, on top of Solid Queue's four forked
      # processes — and the six processes' combined footprint kept the 512MB
      # instance pinned against its memory limit and OOM-crash-looping.
      - key: WEB_CONCURRENCY
        value: "0"
      # Restart Puma gracefully (drain, then re-exec in place) once container
      # memory stays above this percent of the cgroup limit for two 30s
      # checks, instead of letting the kernel SIGKILL the container
      # mid-request. See lib/puma/plugin/memory_watchdog.rb; 0 = log only.
      - key: MEMORY_WATCHDOG_RESTART_PERCENT
        value: "90"
      # How long a request may hold one of the three Puma threads before
      # rack-timeout raises in it. Two tiers, because the spread between a
      # dashboard render and a multi-locale flow generation is two orders of
      # magnitude: DEFAULT covers ordinary pages, SLOW covers the Claude
      # endpoints, the imports and the exports. The streaming endpoints are
      # exempt entirely. See lib/request_timeout.rb for which route is which.
      # Render's edge drops the *client* connection on its own timeout but
      # leaves Rails working, so this is what actually frees the thread.
      - key: REQUEST_TIMEOUT_DEFAULT
        value: "45"
      - key: REQUEST_TIMEOUT_SLOW
        value: "240"
      # Cap glibc malloc arenas (default is 8 x CPU). Ruby's threaded server
      # otherwise fragments memory across many arenas and RSS creeps up until
      # the 512MB starter instance is OOM-killed and Render returns 502s.
      # Harmless under jemalloc (it ignores this), kept as a safety net.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Conservative Ruby GC tuning for a memory-constrained instance: grow the
      # heap slowly and trigger GC sooner on malloc growth, trading a little CPU
      # for lower peak RSS. Negligible latency impact at this QPS.
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.1"
      - key: RUBY_GC_MALLOC_LIMIT
        value: "16777216"
      - key: RUBY_GC_MALLOC_LIMIT_MAX
        value: "33554432"
      - key: RUBY_GC_OLDMALLOC_LIMIT
        value: "16777216"
      - key: RUBY_GC_OLDMALLOC_LIMIT_MAX
        value: "33554432"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Staff allowlist for /blazer AND the Ask Verto review queue at
      # /ask/review — deny-by-default, so while this is unset nobody can
      # approve an offered Verto and the Ask Verto corpus can never grow
      # through the app. Comma/space-separated sign-in emails.
      - key: BLAZER_STAFF_EMAILS
        sync: false
      # Error tracking. See config/initializers/sentry.rb and
      # docs/DEPLOYMENT_RUNBOOK.md for the one-time Sentry org setup (EU data
      # region is chosen there, not here). Blank = errors only reach the logs.
      - key: SENTRY_DSN
        sync: false
      # Active Storage on a shared S3-compatible bucket (Cloudflare R2, EU
      # jurisdiction) instead of the per-instance disk above — the change that
      # lets this service run more than one instance and lets the worker reach
      # attachments. All blank = local disk, exactly as before. The five
      # STORAGE_* vars CONFIGURE the bucket (so `bin/rails object_storage:migrate`
      # can copy into it while uploads still go to the disk);
      # ACTIVE_STORAGE_SERVICE=bucket is the separate cutover SWITCH, set last.
      # Staged runbook with rollback at each step: docs/OBJECT_STORAGE_CUTOVER.md.
      - key: ACTIVE_STORAGE_SERVICE
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      # Rails.cache + rate-limit counters move onto Render Key Value (Valkey)
      # when this is set (config/environments/production.rb). Dashboard-managed
      # (sync: false) — declared here so a blueprint sync never prunes the value,
      # and so the dedicated worker below can pull the SAME store via fromService.
      - key: REDIS_URL
        sync: false
      # How long any single Claude call may hold a request thread, and how many
      # times it retries, before failing fast. Bounds thread occupancy so a slow
      # Anthropic API can't tie up every Puma thread and 502 the whole app.
      # Code defaults live in AnthropicHelpers; set here to make them tunable.
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "120"
      - key: ANTHROPIC_MAX_RETRIES
        value: "1"
      # Claude calls one organisation may make per UTC day, across every AI
      # endpoint. Per-user rate limits live in the controllers (ThrottlesAiSpend);
      # this is the organisation-wide ceiling — the number that shows up on the
      # Anthropic invoice. Counted in Rails.cache, which is Solid Cache on the
      # primary database, so it survives deploys and watchdog restarts. 0 = off.
      - key: AI_DAILY_GENERATION_CAP
        value: "300"
      - key: SECRET_KEY_BASE
        generateValue: true
      # Google OAuth client — used by "Continue with Google" on BOTH sides
      # (creators at /session/new, respondents at the end of a Verto) and by
      # the Sheets export; buttons appear once set. The two sign-in strategies
      # have separate callback paths, so the client needs the google_player
      # redirect URIs as well as the google_oauth2 ones — all four are listed
      # in .env.example. Missing the player pair fails respondent sign-in with
      # redirect_uri_mismatch while creator sign-in carries on working.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Active Record Encryption (encrypts stored Google tokens) — see
      # docs/ENCRYPTION_KEYS.md.
      #
      # generateValue mints these ONCE and keeps them stable for the life of
      # THIS service. It does not back them up. If the service is ever recreated
      # — or the env group rebuilt — Render generates new values, and every
      # google_refresh_token already in the database becomes undecryptable.
      #
      # So they DO need manual handling: copy all three into a secret store the
      # owner controls. This comment previously said the opposite, which is the
      # kind of reassurance that stops anyone checking.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # Location search (the "Where do you live?" demographic). The public
      # OpenStreetMap Nominatim server 403s server-side calls from datacenter
      # IPs like Render's, so set a LocationIQ key (a hosted Nominatim that
      # permits server-side use) to make the search work in production. Region
      # defaults to us1; set eu1 for EU. See .env.example / NominatimClient.
      - key: LOCATIONIQ_API_KEY
        sync: false
      - key: LOCATIONIQ_REGION
        value: eu1
      # App-wide outbound cap for the geocoder (SharedRateLimiter, P1-11). The
      # per-IP rate_limit on #location_search bounds one respondent; this bounds
      # the whole app, which is what the provider's usage policy is written
      # about. LocationIQ's free tier allows 2/second — raise this to match a
      # paid plan. Over budget, a search returns no suggestions rather than
      # sleeping on a Puma thread.
      - key: GEOCODE_MAX_RPS
        value: "2"
      - key: APP_HOST
        sync: false
      - key: APP_PROTOCOL
        value: https
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTHENTICATION
        value: plain
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_TLS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: survey-poc-db
          property: connectionString

  # Dedicated Solid Queue worker. ONLY needed for the scale-OUT posture — a web
  # tier that has handed off the queue by setting RUN_SOLID_QUEUE_IN_PUMA=0 on the
  # web service (so no Puma worker also runs the queue + scheduler, which would
  # double-fire config/recurring.yml tasks). A single-box deployment does NOT need
  # this at all: Solid Queue runs exactly once, in the Puma master. This whole
  # block is inert until a blueprint sync deliberately creates the service.
  #
  # Secrets ride `fromService` so they MATCH the web service byte-for-byte — the
  # ACTIVE_RECORD_ENCRYPTION_* keys and SECRET_KEY_BASE especially, or the worker
  # mints fresh ones and can't decrypt stored Google tokens / verify sessions.
  #
  # This worker has NO Active Storage disk. While the app is on the local disk
  # (ACTIVE_STORAGE_SERVICE unset) the three storage-writing jobs
  # (RenderReportPdfJob, RenderInfographicJob, BuildVertoJob) would write to its
  # ephemeral filesystem, unreachable by the web service — acceptable only for a
  # burst window that generates no reports. Once the app is on the bucket
  # (ACTIVE_STORAGE_SERVICE=bucket, docs/OBJECT_STORAGE_CUTOVER.md) the worker
  # reads and writes the same store as the web service and the limitation is gone.
  #
  # If it is ever created, give it the web service's `runtime: image` +
  # `image.url` in place of `runtime: docker`, `branch` and `autoDeployTrigger`
  # (none apply to an image-backed service), so both run the image CI proved —
  # AND add a second POST to the deploy job in .github/workflows/ci.yml for
  # this service's own Deploy Hook (same imgURL, after the web service's, red
  # on failure like it). Deploy hooks are per service and an image-backed
  # service never auto-deploys, so without that POST the worker would stay on
  # the :main it was created from and run old job code against every schema
  # the web service's preDeployCommand migrates after it.
  - type: worker
    name: vertonow-worker
    runtime: docker
    region: frankfurt
    branch: Main
    autoDeployTrigger: off
    # Skips db:prepare (SKIP_DB_PREPARE below) then execs this: the Solid Queue
    # supervisor (dispatcher + worker + scheduler), same as bin/jobs locally.
    dockerCommand: bin/jobs
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      # Migrations belong to the web service (its preDeploy + entrypoint); the
      # worker must not race them. See bin/docker-entrypoint.
      - key: SKIP_DB_PREPARE
        value: "1"
      # This service RUNS the queue, so it leaves RUN_SOLID_QUEUE_IN_PUMA unset and
      # keeps the DB pool's Solid Queue headroom (config/database.yml). Its threads
      # are queue worker threads (config/queue.yml), not web request threads.
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: survey-poc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: web
          name: survey-poc
          envVarKey: REDIS_URL
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: survey-poc
          envVarKey: SECRET_KEY_BASE
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        fromService:
          type: web
          name: survey-poc
          envVarKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          type: web
          name: survey-poc
          envVarKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          type: web
          name: survey-poc
          envVarKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      # Jobs call Claude (BuildVerto, GenerateFlow, TranslateLocales, corpus
      # refresh, newsletter). Same key + tuning as the web service.
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: survey-poc
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "120"
      - key: ANTHROPIC_MAX_RETRIES
        value: "1"
      - key: AI_DAILY_GENERATION_CAP
        value: "300"
      # Comms jobs send mail; mailers need SMTP + host/from. Pulled from the web
      # service so the two stay identical.
      - key: APP_HOST
        fromService:
          type: web
          name: survey-poc
          envVarKey: APP_HOST
      - key: APP_PROTOCOL
        value: https
      - key: MAIL_FROM
        fromService:
          type: web
          name: survey-poc
          envVarKey: MAIL_FROM
      - key: MAIL_REPLY_TO
        fromService:
          type: web
          name: survey-poc
          envVarKey: MAIL_REPLY_TO
      - key: SMTP_ADDRESS
        fromService:
          type: web
          name: survey-poc
          envVarKey: SMTP_ADDRESS
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        fromService:
          type: web
          name: survey-poc
          envVarKey: SMTP_USERNAME
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: survey-poc
          envVarKey: SMTP_PASSWORD
      - key: SMTP_AUTHENTICATION
        value: plain
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_TLS
        value: "false"
      # Sheets/Drive export jobs.
      - key: GOOGLE_CLIENT_ID
        fromService:
          type: web
          name: survey-poc
          envVarKey: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromService:
          type: web
          name: survey-poc
          envVarKey: GOOGLE_CLIENT_SECRET
      - key: SENTRY_DSN
        fromService:
          type: web
          name: survey-poc
          envVarKey: SENTRY_DSN
      # Object storage — identical to the web service, so the worker reads AND
      # writes the same bucket the moment ACTIVE_STORAGE_SERVICE flips there.
      - key: ACTIVE_STORAGE_SERVICE
        fromService:
          type: web
          name: survey-poc
          envVarKey: ACTIVE_STORAGE_SERVICE
      - key: STORAGE_BUCKET
        fromService:
          type: web
          name: survey-poc
          envVarKey: STORAGE_BUCKET
      - key: STORAGE_ENDPOINT
        fromService:
          type: web
          name: survey-poc
          envVarKey: STORAGE_ENDPOINT
      - key: STORAGE_REGION
        fromService:
          type: web
          name: survey-poc
          envVarKey: STORAGE_REGION
      - key: STORAGE_ACCESS_KEY_ID
        fromService:
          type: web
          name: survey-poc
          envVarKey: STORAGE_ACCESS_KEY_ID
      - key: STORAGE_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: survey-poc
          envVarKey: STORAGE_SECRET_ACCESS_KEY
      # Same memory posture as the web container.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.1"

databases:
  - name: survey-poc-db
    # The live database ("PlayVertoNow", PostgreSQL 18) runs Basic-256mb in
    # Frankfurt — owner-confirmed 2026-09-01. If a blueprint sync rejects the
    # plan name, read the exact enum off the dashboard; do not fall back to
    # "starter"/"oregon", both were stale fictions.
    plan: basic-256mb
    region: frankfurt
