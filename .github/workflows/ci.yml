name: CI

on:
  pull_request:
  push:
    branches: [ Main, main ]
  # A run that dies with `startup_failure` never started, so GitHub refuses to
  # retry it — and the deploy job below only fires from a green run, so that
  # commit sits undeployed with nothing to click. A dispatch on Main runs the
  # whole workflow, deploy included (its `if` tests the ref, not the event).
  # Without this trigger the only way back is an empty commit. 2026-08-26: one
  # push produced two runs, one stuck queued and one startup_failure, and the
  # deploy waited on both.
  workflow_dispatch:

# One run per ref at a time; a newer push cancels the older run. On Main this
# is safe as well as cheap: the deploy job names the commit's own image, so a
# run for commit A that finished after commit B was pushed would deploy A's
# image — never B untested. Cancelling A just leaves B's own run to deploy B
# once it is green, without an older commit going live in between.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # One forked worker per runner core (test/test_helper.rb does the same
      # locally); each gets its own SQLite file. nproc rather than a literal so
      # a runner with a different core count is neither oversubscribed — which
      # flakes browser timings — nor left idle.
      - name: Run tests
        env:
          RAILS_ENV: test
          # The suite stubs every Anthropic client (no real API calls), but the
          # service constructors ENV.fetch the key, so a placeholder must exist.
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          bin/rails db:test:prepare
          PARALLEL_WORKERS=$(nproc) bin/rails test

  test_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The suite, on production's engine. Dev and test run SQLite while Render
    # runs Postgres, and the two disagree on real things — LOWER() over a json
    # column, DISTINCT over rows that contain one — that SQLite lets straight
    # through. Ask Verto shipped broken exactly that way; this job turns that
    # class of production-only failure into a red check that blocks the deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Each worker creates and loads its own survey_poc_test_N database; the
      # service container's postgres role is a superuser, so CREATE DATABASE
      # needs no extra grant.
      - name: Run tests against Postgres
        env:
          RAILS_ENV: test
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/survey_poc_test
        run: |
          bin/rails db:test:prepare
          PARALLEL_WORKERS=$(nproc) bin/rails test

  system_test:
    runs-on: ubuntu-latest
    # A wedged Chrome used to hold the deploy for GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      # A flake in one shard must not cancel the others: "Re-run failed jobs"
      # then costs one shard's few minutes, not the whole suite's.
      fail-fast: false
      matrix:
        # The one knob for re-balancing. bin/ci_shard deals the sorted file
        # list across however many entries are here; a six-way split of the
        # 2026-09-13 per-file timings lands within ~40s across shards, which
        # is why it is six and not a timing-weighted split.
        shard: [ 0, 1, 2, 3, 4, 5 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Browser tests (P2-5). Separate from `test` on purpose: they drive a
      # real Chrome, so if one goes flaky it is visible and separable rather
      # than taking the unit suite — and therefore the deploy — down with it.
      # Sharded because this job was the whole critical path: one job took
      # 25-28 minutes while everything else finished inside 3.5. Each shard
      # runs its files with one forked worker per core, each worker with its
      # own Puma and Chrome — the same as `bin/rails test:system` locally.
      # ubuntu-latest ships Chrome; ApplicationSystemTestCase finds it, and
      # falls back to Ferrum's own detection if the path ever moves.
      #
      # Explicit file paths bypass the runner's default exclusion of
      # test/system, which is what lets `bin/rails test` run browser tests
      # here. They also skip test:prepare, but nothing depends on it: the
      # system test base class builds the Tailwind stylesheet itself at load.
      # The local gate drives the container's Playwright Chromium; this job
      # drives whatever the runner image ships. Say which, so a rendering or
      # timing difference between the two has somewhere to be seen.
      - name: Record the browser
        run: google-chrome --version || chromium --version || true

      - name: Run system tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          RAILS_ENV: test
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          set -euo pipefail
          bin/rails db:test:prepare
          files=$(bin/ci_shard ${{ matrix.shard }} ${{ strategy.job-total }})
          PARALLEL_WORKERS=$(nproc) bin/rails test $files

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots-${{ matrix.shard }}
          # capybara/rails sets Capybara.save_path to tmp/capybara, which is
          # where the failure screenshots actually land; tmp/screenshots was
          # never written to, so nothing was ever uploaded.
          path: tmp/capybara
          if-no-files-found: ignore

  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Deploys are triggered from HERE, the moment every check above is green.
  # The service is image-backed (2026-09-13): this job moves :main onto the
  # commit's image and POSTs the Render Deploy Hook naming it. An image-backed
  # service has no auto-deploy, so this is the ONLY automated path, and a
  # missing secret
  # or a failed POST is a red job, never a quiet no-op — a green run that
  # deploys nothing is the trap. (History: as a source build, Render's own
  # checksPass trigger was seen lagging a green commit by an hour — 2026-08-12,
  # 89802a7: checks green 11:43, auto deploy 12:43.) Fires for a push AND for
  # a workflow_dispatch on Main (the startup_failure hatch above); pull
  # requests carry refs/pull/N/merge and stay excluded by the ref test.
  #
  # Because this job MOVES :main, re-running it on an older run is a rollback:
  # :main goes back to that commit and Render deploys it — and, because the
  # re-run re-enters the ci-<ref> concurrency group above (cancel-in-progress),
  # it cancels any newer commit's run still in flight, leaving that commit
  # undeployed with only a grey "cancelled" to show for it. Deliberate is
  # fine; "Re-run failed jobs" on a stale run by reflex is not.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ test, test_postgres, system_test, scan_ruby, scan_js, lint, build_image ]
    if: github.ref == 'refs/heads/Main'
    permissions:
      contents: read
      packages: write

    # Render runs the image build_image pushed — the service has been
    # image-backed since 2026-09-13 (docs/DEPLOYMENT_RUNBOOK.md §7). Two things
    # happen here, in this order, and only once every other job is green:
    #
    # 1. `:main` is moved onto this commit's image. build_image pushes only
    #    `:<sha>`: it runs alongside the test jobs, not after them, so a tag
    #    it moved would name red commits too (b127f9b, red on CI, sat on
    #    `:main` for 4.5 hours on 2026-09-13). Moved here, `:main` always means
    #    "the last commit every check passed" — which is what the service's
    #    configured reference and the dashboard's "Deploy latest reference"
    #    pull.
    # 2. The deploy hook is POSTed with imgURL naming this commit's image, so
    #    the deploy is of the image CI proved, not of whatever `:main` means
    #    by the time Render pulls it.
    #
    # Image-backed services have no auto-deploy: this hook is the only
    # automated way a commit reaches production (Manual Deploy and Rollback are
    # the hands-on ones), so a missing secret or a failed POST is a red job,
    # never a quiet one. `packages: write` is necessary, not belt-and-braces:
    # the repository's default GITHUB_TOKEN is read-only.
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the main tag onto this commit's image
        run: docker buildx imagetools create -t ghcr.io/play-verto-global-ltd/vertonow:main "ghcr.io/play-verto-global-ltd/vertonow:${GITHUB_SHA}"

      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # The URL embeds a key — it must never be echoed, so curl talks to it
        # silently and only the outcome is printed. imgURL rides along as a
        # query parameter; the hook URL already carries one (?key=…), hence
        # the separator check.
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set — an image-backed service deploys only through this hook, so nothing will deploy this commit."
            exit 1
          fi
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          if curl -fsS -X POST "${HOOK}${sep}imgURL=ghcr.io/play-verto-global-ltd/vertonow:${GITHUB_SHA}" -o /dev/null; then
            echo "Render deploy triggered for ghcr.io/play-verto-global-ltd/vertonow:${GITHUB_SHA}."
          else
            echo "::error::Deploy hook POST failed — nothing else deploys this commit. :main already names it, so Render's Manual Deploy > Deploy latest reference deploys it; re-run this job only while nothing newer has been pushed to Main (a re-run moves :main back here and cancels any newer run in flight); otherwise let the newer run deploy, or use Deploy latest reference."
            exit 1
          fi

  build_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On Main the image is also PUSHED to GHCR, tagged with the commit: it
      # is what Render deploys (the service has been image-backed since
      # 2026-09-13, docs/DEPLOYMENT_RUNBOOK.md §7). Only `:<sha>` is pushed
      # here — this job runs alongside the test jobs, so a `:main` moved here
      # would name red commits too; the deploy job moves `:main` once every
      # check is green.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/Main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Proves the exact Dockerfile Render deploys actually builds. No app
      # secrets needed - docker build only runs bundle install, bootsnap
      # precompile, and SECRET_KEY_BASE_DUMMY=1 assets:precompile (already in
      # the Dockerfile).
      #
      # The package sits in the org's namespace, the same owner as this
      # repository, so the GITHUB_TOKEN above can write it with `packages:
      # write` and nothing else. That is the point of it being there: the
      # personal `napps9/survey-poc` this replaced became unwritable the
      # moment the repository moved to the org (run 801, 21 September — every
      # test job green, the image built, only the push refused), and it could
      # not be granted back. A personal package's Manage-Actions-access picker
      # offers that account's OWN repositories and nothing else, so there was
      # no grant to give. Pre-move `:<sha>` images are still on that package —
      # see DEPLOYMENT_RUNBOOK §7 before rolling back past the move.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/Main' }}
          tags: ghcr.io/play-verto-global-ltd/vertonow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

